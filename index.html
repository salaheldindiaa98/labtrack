<script>
const APP_VERSION='20.0';

const rng=n=>Array.from({length:n},(_,i)=>i+1),FV=()=>firebase.firestore.FieldValue.delete();
const DEF=[['att','Attendance','att',10],['pe1','Practical exam 1','in',10],['pe2','Practical exam 2','in',10],['ex1','Exam 1','in',10],['ex2','Exam 2','in',10],['ex3','Exam 3','in',10],['pf','Portfolio','in',10],['fin','Final grade','in',40]].map(([k,n,t,max])=>({k,n,t,max,mode:'ratio',pen:1}));
let S={tab:'att',lab:'',gl:'',aw:1,gfk:'',aq:'',gq:'',admin:false,cfg:null,labs:[],studs:[],user:null,profile:null,instructors:[]},db,auth,started=0,FO=null,unsubs=[],insUnsub=null,profileUnsub=null,signupBusy=false;

/* ---------- start-up, setup, account access ---------- */
const CFG={apiKey:"AIzaSyAxgPrBcVszBieseQXfaz5JqcO_UAAopg0",authDomain:"labtrack-c55fb.firebaseapp.com",projectId:"labtrack-c55fb",storageBucket:"labtrack-c55fb.firebasestorage.app",messagingSenderId:"561200653207",appId:"1:561200653207:web:e7cb27d82c1b97e3575ad2"};
const SEC_RULES=`rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {
  function signedIn() { return request.auth != null; }
  function admin() {
   return signedIn()
    && exists(/databases/$(database)/documents/cfg/main)
    && request.auth.uid in get(/databases/$(database)/documents/cfg/main).data.admins;
  }
  function approved() {
   return signedIn()
    && exists(/databases/$(database)/documents/instructors/$(request.auth.uid))
    && get(/databases/$(database)/documents/instructors/$(request.auth.uid)).data.approved == true
    && get(/databases/$(database)/documents/instructors/$(request.auth.uid)).data.status == 'approved';
  }

  match /instructors/{uid} {
   allow get: if signedIn() && (request.auth.uid == uid || admin());
   allow list: if admin();
   allow create: if admin() || (signedIn() && request.auth.uid == uid
    && request.resource.data.approved == false
    && request.resource.data.status == 'pending'
    && request.resource.data.role == 'instructor'
    && request.resource.data.email == request.auth.token.email);
   allow update, delete: if admin();
  }

  match /cfg/main {
   allow get: if signedIn() && (!exists(/databases/$(database)/documents/cfg/main) || approved() || admin());
   allow create: if signedIn() && !exists(/databases/$(database)/documents/cfg/main)
    && request.resource.data.admins.size() == 1
    && request.resource.data.admins[0] == request.auth.uid;
   allow update: if admin() || (approved()
    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['altLabLimit','absenceWarn']));
  }
  match /cfg/template {
   allow read: if approved() || admin();
   allow write: if admin();
  }
  match /labs/{id} { allow read, write: if approved() || admin(); }
  match /students/{id} { allow read, write: if approved() || admin(); }
 }
}`;
const defaultCfg=uid=>({weeks:12,locked:{},items:DEF,admins:[uid],altLabLimit:2,absenceWarn:3});
const ts=()=>firebase.firestore.FieldValue.serverTimestamp();
function stopLive(){unsubs.splice(0).forEach(u=>{try{u()}catch(_){}});if(insUnsub){try{insUnsub()}catch(_){ }insUnsub=null}started=0;S.cfg=null;S.labs=[];S.studs=[];S.instructors=[]}
function stopProfileWatch(){if(profileUnsub){try{profileUnsub()}catch(_){ }profileUnsub=null}}
function boot(){const c=localStorage.fbc||JSON.stringify(CFG);
 try{firebase.initializeApp(JSON.parse(c));auth=firebase.auth();db=firebase.firestore()}catch(e){return setup('Config problem: '+e.message)}
 auth.onAuthStateChanged(async u=>{S.user=u||null;if(signupBusy)return;if(!u){stopLive();stopProfileWatch();S.profile=null;return login()}await gateUser(u)})}
function setup(err=''){$('#app').innerHTML=`<main><div class=card><h2>LabTrack setup</h2>
<p class=m>1. In Firebase create a Web app and copy its firebaseConfig.<br>2. Authentication → Sign-in method: enable <b>Email/Password</b>. You do not need to add instructors under Firebase Users.<br>3. Firestore Database → Rules: paste the secure rules below and Publish. The first LabTrack account created in a new database becomes the admin; later accounts wait for admin approval.</p>
<pre class=rulesbox>${esc(SEC_RULES)}</pre><button class=g onclick=copyRules()>Copy security rules</button>
<label>Paste your firebaseConfig here<textarea id=cfgt rows=7 style="width:100%"></textarea></label>
<p class=e>${esc(err)}</p><button onclick=saveCfg()>Save and continue</button></div></main>`}
function saveCfg(){const o={};for(const m of $('#cfgt').value.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId)return setup('apiKey or projectId not found. Paste the whole config.');localStorage.fbc=JSON.stringify(o);location.reload()}
async function copyRules(){try{await navigator.clipboard.writeText(SEC_RULES);alert('Security rules copied. Paste them in Firebase → Firestore Database → Rules and press Publish.')}catch(_){alert('Copy failed. Select the rules text and copy it manually.')}}
function login(err='',mode='signin',note=''){$('#app').innerHTML=`<div class=authwrap><div class="card authcard"><div class=authbrand><h1>LabTrack</h1><p>Instructor access · v19</p></div>
<div class=authseg><button class="${mode==='signin'?'on':''}" onclick="login('','signin')">Sign in</button><button class="${mode==='signup'?'on':''}" onclick="login('','signup')">Create account</button></div>
${mode==='signup'?`<label>Full name<input id=nm autocomplete=name placeholder="Instructor name"></label><label>Email<input id=em type=email autocomplete=email></label><label>Password<input id=pw type=password autocomplete=new-password minlength=6></label><label>Confirm password<input id=pw2 type=password autocomplete=new-password minlength=6></label><button class=wide onclick=signUp()>Create LabTrack account</button><p class=m>Your account will remain pending until a LabTrack admin approves it.</p>`:mode==='forgot'?`<h3>Reset password</h3><label>Email<input id=em type=email autocomplete=email></label><button class=wide onclick=sendReset()>Send reset email</button><button class="authlink wide" onclick="login('','signin')">Back to sign in</button>`:`<label>Email<input id=em type=email autocomplete=email></label><label>Password<input id=pw type=password autocomplete=current-password onkeydown="if(event.key==='Enter')signIn()"></label><button class=wide onclick=signIn()>Sign in</button><button class="authlink wide" onclick="login('','forgot')">Forgot password?</button>`}
${note?`<p class=m>${esc(note)}</p>`:''}${err?`<p class=e>${esc(err)}</p>`:''}<div style="margin-top:14px;text-align:center"><button class=g onclick="localStorage.removeItem('fbc');location.reload()">Change Firebase setup</button></div></div></div>`}
function friendlyAuth(e){const c=e?.code||'',m={
 'auth/email-already-in-use':'An account already exists with this email. Use Sign in instead.',
 'auth/invalid-email':'Enter a valid email address.','auth/weak-password':'Use a password of at least 6 characters.',
 'auth/invalid-credential':'Incorrect email or password.','auth/user-not-found':'Incorrect email or password.',
 'auth/wrong-password':'Incorrect email or password.','auth/too-many-requests':'Too many attempts. Please wait and try again.'};return m[c]||e?.message||'Something went wrong.'}
function signIn(){const em=$('#em')?.value.trim(),pw=$('#pw')?.value||'';if(!em||!pw)return login('Enter your email and password.','signin');auth.signInWithEmailAndPassword(em,pw).catch(e=>login(friendlyAuth(e),'signin'))}
async function signUp(){const name=$('#nm')?.value.trim(),email=$('#em')?.value.trim().toLowerCase(),pw=$('#pw')?.value||'',pw2=$('#pw2')?.value||'';
 if(name.length<2)return login('Enter your full name.','signup');if(!email)return login('Enter your email address.','signup');if(pw.length<6)return login('Password must be at least 6 characters.','signup');if(pw!==pw2)return login('The two passwords do not match.','signup');
 signupBusy=true;let cred=null;try{cred=await auth.createUserWithEmailAndPassword(email,pw);try{await cred.user.updateProfile({displayName:name})}catch(_){}
  const p={name,email,role:'instructor',approved:false,status:'pending',createdAt:ts()};await db.collection('instructors').doc(cred.user.uid).set(p);signupBusy=false;S.user=cred.user;await gateUser(cred.user)
 }catch(e){signupBusy=false;if(cred){try{await auth.signOut()}catch(_){}}login(friendlyAuth(e),'signup')}}
async function sendReset(){const email=$('#em')?.value.trim();if(!email)return login('Enter your email address.','forgot');try{await auth.sendPasswordResetEmail(email);login('','signin','Password reset email sent.')}catch(e){login(friendlyAuth(e),'forgot')}}
function loadingAccount(){$('#app').innerHTML=`<div class=authwrap><div class="card authcard accountstate"><div class=ico>⋯</div><h2>Checking your LabTrack account</h2><p class=m>Please wait.</p></div></div>`}
function pendingScreen(){stopLive();const p=S.profile||{};$('#app').innerHTML=`<div class=authwrap><div class="card authcard accountstate"><div class=ico>⏳</div><h2>Awaiting approval</h2><p><b>${esc(p.name||S.user?.displayName||'Instructor')}</b></p><p class=m>${esc(p.email||S.user?.email||'')}</p><p>Your LabTrack account was created successfully. An administrator must approve it before you can access student data.</p><div class=row style="justify-content:center"><button onclick=refreshAccess()>Check again</button><button class=g onclick="auth.signOut()">Sign out</button></div></div></div>`}
function rejectedScreen(){stopLive();const p=S.profile||{};$('#app').innerHTML=`<div class=authwrap><div class="card authcard accountstate"><div class=ico>⛔</div><h2>Account not approved</h2><p><b>${esc(p.name||S.user?.displayName||'Instructor')}</b></p><p class=m>${esc(p.email||S.user?.email||'')}</p><p>This LabTrack account is currently rejected. Contact the LabTrack administrator if access should be restored.</p><button class=g onclick="auth.signOut()">Sign out</button></div></div>`}
async function refreshAccess(){if(S.user)await gateUser(S.user)}
async function gateUser(u){loadingAccount();const ref=db.collection('instructors').doc(u.uid);try{
 let d=await ref.get(),p=d.exists?d.data():null;
 if(!p){let cfg=null;try{cfg=await db.doc('cfg/main').get()}catch(_){}
  const legacyAdmin=cfg?.exists&&(cfg.data().admins||[]).includes(u.uid);
  p={name:u.displayName||u.email?.split('@')[0]||'Instructor',email:u.email||'',role:legacyAdmin?'admin':'instructor',approved:!!legacyAdmin,status:legacyAdmin?'approved':'pending',createdAt:ts()};await ref.set(p,{merge:true});d=await ref.get();p=d.data()
 }
 // Brand-new database only: the first LabTrack registrant becomes administrator.
 if(!p.approved&&p.status!=='rejected')try{const c=await db.doc('cfg/main').get();if(!c.exists){await db.doc('cfg/main').set(defaultCfg(u.uid));await ref.set({approved:true,status:'approved',role:'admin',approvedAt:ts(),approvedBy:u.uid},{merge:true});d=await ref.get();p=d.data()}}catch(_){}
 S.profile={id:u.uid,...p};watchOwnProfile(ref);
 if(S.profile.approved===true&&S.profile.status==='approved')return start();
 return S.profile.status==='rejected'?rejectedScreen():pendingScreen()
 }catch(e){console.error(e);$('#app').innerHTML=`<div class=authwrap><div class="card authcard accountstate"><div class=ico>⚠</div><h2>Account check failed</h2><p class=e>${esc(friendlyAuth(e))}</p><p class=m>If you just upgraded LabTrack, publish the current Firestore security rules from the admin Settings page.</p><button class=g onclick="auth.signOut()">Sign out</button></div></div>`}}
function watchOwnProfile(ref){stopProfileWatch();profileUnsub=ref.onSnapshot(d=>{if(!d.exists)return;const p={id:d.id,...d.data()},wasApproved=S.profile?.approved===true;S.profile=p;if(p.approved!==true||p.status!=='approved'){if(started)stopLive();return p.status==='rejected'?rejectedScreen():pendingScreen()}if(!started)start();else if(!wasApproved)render()},()=>{})}
function watchInstructors(){if(S.admin&&!insUnsub){insUnsub=db.collection('instructors').onSnapshot(q=>{S.instructors=q.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==='ins')render()},e=>console.error(e))}else if(!S.admin&&insUnsub){try{insUnsub()}catch(_){}insUnsub=null;S.instructors=[];if(S.tab==='ins')S.tab='att'}}
function start(){if(started)return;started=1;
 unsubs.push(db.doc('cfg/main').onSnapshot(d=>{if(!d.exists)return d.ref.set(defaultCfg(S.user.uid));S.cfg=d.data();S.admin=(S.cfg.admins||[]).includes(S.user.uid);const p={};if(S.cfg.altLabLimit==null)p.altLabLimit=2;if(S.cfg.absenceWarn==null)p.absenceWarn=3;if(Object.keys(p).length)d.ref.set(p,{merge:true});if(S.aw>S.cfg.weeks)S.aw=S.cfg.weeks;watchInstructors();render()},e=>{console.error(e);alert(e.message)}));
 unsubs.push(db.collection('labs').onSnapshot(q=>{S.labs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{numeric:true}));if(!S.labs.find(l=>l.id===S.lab))S.lab=S.labs[0]?.id||'';render()}));

function calc(s){const m={},it=S.cfg.items,g=s.g||{};
 const v=k=>{if(k in m)return m[k];const i=it.find(x=>x.k===k);m[k]=null;if(!i)return null;let r=null;
  if(i.t=='in'){const q=g[k];r=q==='Abs'?0:q===undefined||q===''||isNaN(+q)?null:+q}
  else if(i.t=='att'){const p=attN(s),b=absN(s);r=i.mode=='pen'?Math.max(0,i.max-b*i.pen):p/S.cfg.weeks*i.max}
  else if(i.t=='grp'){let xs=(i.src||[]).map(v).filter(x=>x!==null).sort((a,b)=>b-a);if(i.top>0)xs=xs.slice(0,i.top);if(xs.length){r=xs.reduce((a,b)=>a+b,0);if(i.agg=='avg')r/=xs.length;r*=i.mul}}

 if(s.lab===S.lab){if(cur==='P'){qrShow('warn','Already marked present',s,`${labName(s.lab)} · Week ${w}`);return}await St(s._).update({['att.'+w]:'P',['alt.'+w]:FV()});QRSCAN.count++;qrBeep(true);qrShow('ok','Present',s,`${labName(s.lab)} · Week ${w}`);return}
 const lim=Math.max(0,+S.cfg.altLabLimit||0),used=altN(s),alreadyHere=cur==='X'&&(s.alt||{})[w]===S.lab;if(alreadyHere){qrShow('warn','Already marked here as a visiting student',s,`${labName(s.lab)} → ${l.name} · Other-lab ${used}/${lim}`);return}if(lim<1){qrBeep(false);qrShow('err','Other-lab attendance is disabled',s,`Home lab: ${labName(s.lab)}`);return}if(cur!=='X'&&used>=lim){qrBeep(false);qrShow('err','Other-lab allowance reached',s,`${used}/${lim} already used · Home lab: ${labName(s.lab)}`);return}await St(s._).update({['att.'+w]:'X',['alt.'+w]:S.lab});QRSCAN.count++;qrBeep(true);qrShow('ok','Present here as visiting student',s,`${labName(s.lab)} → ${l.name} · Other-lab ${cur==='X'?used:used+1}/${lim}`)}

/* ---------- Excel import / export ---------- */
function parse(rows){if(!rows.length)return[];const h=rows[0].map(x=>String(x).toLowerCase().trim()),f=r=>h.findIndex(x=>r.test(x));
 let c={sn:f(/serial|^sn$|^no\.?$|^#$/),sid:f(/\bid\b|code/),nm:f(/name/)},st=1;if(c.sid<0&&c.nm<0){st=0;c=rows[0].length>2?{sn:0,sid:1,nm:2}:{sn:-1,sid:0,nm:1}}
 return rows.slice(st).filter(r=>r.some(x=>x!=='')).map(r=>({sn:c.sn<0?'':String(r[c.sn]??'').trim(),sid:c.sid<0?'':String(r[c.sid]??'').trim(),nm:c.nm<0?'':String(r[c.nm]??'').trim()}))}
/* Course serial files exported for this course may contain only ID + Name.
   In that format, the student's serial is the 1-based order of the data rows. */
function parseCourseSerials(rawRows){
 if(!rawRows.length)return {rows:[],source:'none'};
 const h=rawRows[0].map(x=>String(x??'').toLowerCase().trim());
 const hasSerial=h.some(x=>/serial|^sn$|^no\.?$|^#$/.test(x));
 const rows=parse(rawRows);
 if(hasSerial)return {rows,source:'column'};
 return {rows:rows.map((q,i)=>({...q,sn:String(i+1)})),source:'row-order'}
}
function parseSisRoster(text){
 const clean=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(),out=[],seen=new Set();
 const add=(cells)=>{if(cells.length<3)return;const sid=clean(cells[1]),nm=clean(cells[2]);if(!sid||!nm||/^id$/i.test(sid)||/^name$/i.test(nm))return;const k=norm(sid);if(!k||seen.has(k))return;seen.add(k);out.push({sn:'',sid,nm})};
 try{const d=new DOMParser().parseFromString(String(text||''),'text/html');for(const tr of d.querySelectorAll('table tr'))add([...tr.children].filter(x=>/^(TD|TH)$/i.test(x.tagName)).map(x=>x.textContent||''))}catch(e){}
 if(out.length)return out;
 /* Oracle SIS exports an HTML table with an .xls extension and may omit closing </tr> tags. */
 const decode=x=>{const d=new DOMParser().parseFromString('<body>'+x+'</body>','text/html');return d.body.textContent||''};
 for(const part of String(text||'').split(/<tr\b[^>]*>/i).slice(1)){const cells=[...part.matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map(m=>decode(m[1]));add(cells)}
 return out
}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=db.batch();for(const o of ops.slice(i,i+400)){if(o.t=='delete')b.delete(o.ref);else if(o.t=='set')b.set(o.ref,o.data);else b.update(o.ref,o.data)}await b.commit()}}
async function syncSisRoster(rows,inp){
 const col=db.collection('students'),pool=LS(S.lab),fileIds=new Set(rows.map(q=>norm(q.sid)).filter(Boolean)),keep=new Set(),adds=[];
 const existingById=new Map();for(const s of pool){const k=norm(s.sid);if(k&&!existingById.has(k))existingById.set(k,s)}
 for(const q of rows){const k=norm(q.sid),s=existingById.get(k);if(s)keep.add(s._);else adds.push(q)}
 const rem=pool.filter(s=>!fileIds.has(norm(s.sid)));
 if(!confirm(`Synchronize this lab from the original SIS .xls file?\n\nStudents read from SIS: ${rows.length}\nKeep unchanged: ${keep.size}\nAdd: ${adds.length}\nRemove: ${rem.length}\n\nExisting students keep their attendance, grades, serial number, and stored name.`)){inp.value='';return}
 const ops=[];rem.forEach(s=>ops.push({t:'delete',ref:col.doc(s._)}));adds.forEach(q=>ops.push({t:'set',ref:col.doc(),data:{lab:S.lab,sn:'',sid:q.sid,nm:q.nm,att:{},alt:{},g:{}}}));await commitOps(ops);
 alert(`SIS roster synchronized.\nRead: ${rows.length}\nKept unchanged: ${keep.size}\nAdded: ${adds.length}\nRemoved: ${rem.length}`)
}
function imp(inp,kind){const f=inp.files[0];if(!f)return;
 if(kind==0){
  if(!/\.xls$/i.test(f.name)){alert('Please upload the original SIS .xls roster file. No conversion to .xlsx is needed.');inp.value='';return}
  const r=new FileReader();r.onload=async e=>{try{const rows=parseSisRoster(e.target.result);if(!rows.length)throw new Error('No SIS students were found. Expected Student ID in column 2 and Name in column 3.');await syncSisRoster(rows,inp)}catch(x){alert('SIS roster import failed: '+x.message)}finally{inp.value=''}};r.onerror=()=>{alert('Could not read the SIS .xls file.');inp.value=''};r.readAsText(f,'utf-8');return
 }
 const r=new FileReader();r.onload=async e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rawRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),parsed=parseCourseSerials(rawRows),rows=parsed.rows,col=db.collection('students');
  if(!rows.length)throw new Error('No students were found in the serial file.');
  const sourceNote=parsed.source==='row-order'?`No Serial column was found. LabTrack will use the file order as the course serial: 1 to ${rows.length}.`:'LabTrack found an explicit Serial column and will use it.';
  if(!confirm(`Import serial numbers for ALL labs?\n\n${sourceNote}\n\nMatching students will have their current serial number overwritten regardless of which lab they attend.`)){inp.value='';return}let upd=0,miss=0,amb=0;const ops=[],byId=new Map(),byName=new Map();for(const s of S.studs){const ik=norm(s.sid),nk=norm(s.nm);if(ik){const a=byId.get(ik)||[];a.push(s);byId.set(ik,a)}if(nk){const a=byName.get(nk)||[];a.push(s);byName.set(nk,a)}}for(const q of rows){let matches=[];if(q.sid)matches=byId.get(norm(q.sid))||[];else if(q.nm)matches=byName.get(norm(q.nm))||[];if(matches.length===1){ops.push({t:'update',ref:col.doc(matches[0]._),data:{sn:String(q.sn??'').trim()}});upd++}else if(matches.length>1)amb++;else miss++}await commitOps(ops);const used=parsed.source==='row-order'?`Row order used as serial: 1–${rows.length}`:'Explicit Serial column used';alert(`Course serial import complete across all labs.\n${used}\nUpdated: ${upd}\nNot found: ${miss}\nAmbiguous (not changed): ${amb}`)
 }catch(x){alert('Serial import failed: '+x.message)}finally{inp.value=''}};r.readAsArrayBuffer(f)
}

function vIns(){if(!S.admin)return '<div class=card>Admin access required.</div>';const xs=S.instructors.slice().sort((a,b)=>{const o={pending:0,approved:1,rejected:2};return (o[a.status]??9)-(o[b.status]??9)||String(a.name||'').localeCompare(String(b.name||''))}),n=s=>xs.filter(x=>x.status===s).length;
 return `<div class=card><h2>Instructor accounts</h2><p class=m>New instructors create their own LabTrack account. They cannot access attendance, grades, labs, or students until you approve them here.</p><div class=insgrid><div class=statbox><b>${n('pending')}</b>Pending</div><div class=statbox><b>${n('approved')}</b>Approved</div><div class=statbox><b>${n('rejected')}</b>Rejected</div></div></div>

function securityCard(){return S.admin?`<div class=card><h3>Firebase security rules <span class="badge blue">Required once</span></h3><p class=m>These rules make Pending and Rejected accounts unable to read student data even if someone bypasses the LabTrack interface. Publish them once in Firebase Console → Firestore Database → Rules.</p><pre class=rulesbox>${esc(SEC_RULES)}</pre><button class=g onclick=copyRules()>Copy secure rules</button></div>`:''}

function vSet(){const c=S.cfg,T={in:'Score',att:'Attendance',grp:'Group',sum:'Sum'},nm=k=>c.items.find(i=>i.k===k)?.n;
 const desc=i=>i.t=='att'?(i.mode=='pen'?`max minus ${i.pen} per absence`:'attended / weeks x max'):i.t=='grp'?`${i.agg=='avg'?'average':'sum'} of ${i.top?'highest '+i.top+' of ':''}${(i.src||[]).map(nm).join(', ')}${i.mul!=1?' x '+i.mul:''}`:i.t=='sum'?(i.src||[]).map(nm).join(' + '):'';
 return `<div class=card><h3>Course settings</h3>${S.admin?'':'<p class=m>Only the admin can change grading structure and lock weeks.</p>'}
<label>Number of weeks<input type=number min=1 max=30 ${S.admin?'':'disabled'} value="${c.weeks}" onchange="Cf().update({weeks:+this.value||12})"></label></div>
<div class=card><h3>Attendance policy</h3><p class=m>These two values can be adjusted by any signed-in instructor.</p>
<label>Other-lab attendance allowance per student<input type=number min=0 max=30 value="${c.altLabLimit??2}" onchange="Cf().set({altLabLimit:Math.max(0,+this.value||0)},{merge:true})"></label>
<label>Absence warning threshold <span class=m>(warning appears after the student exceeds this number)</span><input type=number min=0 max=30 value="${c.absenceWarn??3}" onchange="Cf().set({absenceWarn:Math.max(0,+this.value||0)},{merge:true})"></label></div>
<div class=card><h3>Grading items</h3>${c.items.map(i=>`<div class=row><div style="flex:1"><b>${esc(i.n)}</b> <span class=m>${T[i.t]}, max ${i.max}<br>${esc(desc(i))}</span></div>${S.admin?`<button class=g onclick="editItem('${i.k}')">Edit</button><button class=d onclick="delItem('${i.k}')">&#10005;</button>`:''}</div>`).join('')}
${S.admin?`<div class=row><button onclick="editItem('','in')">Add score</button><button onclick="editItem('','grp')">Add group</button><button onclick="editItem('','sum')">Add sum</button></div>
<p class=m>Group: pick scores (like quizzes), then choose average or sum, only the highest N, and a multiplier. Sum: add any items together, including groups and other sums.</p>`:''}</div>${tplCards(c)}${securityCard()}`}
function editItem(k,t){const i=k?{...S.cfg.items.find(x=>x.k===k)}:{k:'c'+Date.now(),t,n:'',max:10,src:[],top:0,agg:'avg',mul:1,mode:'ratio',pen:1},o=S.cfg.items.filter(x=>x.k!==i.k),sel=(a,b)=>a==b?'selected':'';
 $('#modal').innerHTML=`<div class=ov><div class=card><h3>${k?'Edit':'New'} item</h3>
<label>Name<input id=m_n value="${esc(i.n)}"></label><label>Max grade<input id=m_max type=number step=any value="${i.max}"></label>
${i.t=='att'?`<label>Rule<select id=m_mode><option value=ratio ${sel(i.mode,'ratio')}>Attended / weeks x max</option><option value=pen ${sel(i.mode,'pen')}>Max minus marks per absence</option></select></label><label>Marks lost per absence<input id=m_pen type=number step=any value="${i.pen}"></label>`:''}
${i.t=='grp'||i.t=='sum'?`<p class=m>Use these items:</p>${o.map(x=>`<label class=ck><input type=checkbox value="${x.k}" ${(i.src||[]).includes(x.k)?'checked':''}>${esc(x.n)}</label>`).join('')}`:''}
${i.t=='grp'?`<label>Highest N only (0 = all)<input id=m_top type=number value="${i.top}"></label><label>Combine by<select id=m_agg><option value=avg ${sel(i.agg,'avg')}>Average</option><option value=sum ${sel(i.agg,'sum')}>Sum</option></select></label><label>Multiply result by<input id=m_mul type=number step=any value="${i.mul}"></label>`:''}
<div class=row><button onclick="saveItem('${i.k}','${i.t}')">Save item</button><button class=g onclick="$('#modal').innerHTML=''">Cancel</button></div></div></div>`}
function saveItem(k,t){const g=x=>$('#m_'+x)?.value,i={k,t,n:g('n')||'Item',max:+g('max')||0};
 if(t=='att'){i.mode=g('mode');i.pen=+g('pen')||0}
 if(t=='grp'||t=='sum')i.src=[...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(x=>x.value);
 if(t=='grp'){i.top=+g('top')||0;i.agg=g('agg');i.mul=g('mul')===''?1:+g('mul')}
 const it=S.cfg.items.slice(),x=it.findIndex(y=>y.k===k);x<0?it.push(i):it[x]=i;Cf().update({items:it});$('#modal').innerHTML=''}
function delItem(k){if(!confirm('Remove this item?'))return;Cf().update({items:S.cfg.items.filter(i=>i.k!==k).map(i=>i.src?{...i,src:i.src.filter(x=>x!==k)}:i)})}
const CRS0={univ:'Galala University',prog:'PharmD-Clinical Pharmacy Program',sem:'FALL 2025-2026',code:'PPC101',name:'MEDICINAL PLANTS',ch:'3',inst:'Assoc. Prof. Dr. Reda Foad Abdelhameed'};
const SL=['Regular Student','Midterm Excuse','Final Exam Excuse','Withdraw','Incomplete Approved','Repeat Course_Failed','Repeat Course_Improve','Cheating','Other'];
const CL=[['univ','University'],['prog','Program'],['sem','Semester'],['code','Course code'],['name','Course name'],['ch','Credit hours'],['inst','Instructor name']];
const TC=[['mid','Midterm'],['cw','Class work (Quizzes + Project)'],['pr','Practical exam'],['fin','Final']];
function tplCards(c){const ro=S.admin?'':'disabled';return `<div class=card><h3>Excel template</h3>
<p class=m>Upload your template once (use_this.xlsx). Then choose which grading item fills each template column.</p>
<div class=row><input type=file id=tf hidden accept=".xlsx" onchange="upTpl(this)"><button class=g ${ro} onclick="$('#tf').click()">Upload template (.xlsx)</button><button class=g ${ro} onclick=useTpl()>Use template items</button></div>
${TC.map(([k,n])=>`<label>${n}<select ${ro} onchange="setMap('${k}',this.value)"><option value="">Choose item</option>${c.items.map(i=>`<option value="${i.k}" ${(c.map||{})[k]==i.k?'selected':''}>${esc(i.n)}</option>`).join('')}</select></label>`).join('')}
${CL.map(([k,n])=>`<label>${n}<input ${ro} value="${esc((c.course||{})[k]??CRS0[k])}" onchange="setCrs('${k}',this.value)"></label>`).join('')}</div>`}
function setSt(id,v){St(id).update({st:v})}
function setCrs(k,v){Cf().set({course:{[k]:v}},{merge:true})}
function setMap(k,v){Cf().set({map:{[k]:v}},{merge:true})}
function useTpl(){if(!confirm('Replace the grading items with Midterm, Class work, Practical exam and Final?'))return;
 Cf().update({items:[{k:'mid',n:'Midterm',t:'in',max:10},{k:'cw',n:'Class work (Quizzes + Project)',t:'in',max:20},{k:'pr',n:'Practical exam',t:'in',max:30},{k:'fin',n:'Final',t:'in',max:40}],map:{mid:'mid',cw:'cw',pr:'pr',fin:'fin'}})}
function upTpl(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=e=>{const b=e.target.result.split(',')[1];if(b.length>900000)return alert('This file is too big.');
  db.doc('cfg/template').set({b64:b,name:f.name}).then(()=>alert('Template saved in LabTrack v19.')).catch(x=>alert(x.message));inp.value=''};r.readAsDataURL(f)}
async function exTpl(){const c=S.cfg,m=c.map||{},it=k=>c.items.find(i=>i.k==k),cr={...CRS0,...c.course};
 if(!TC.every(([k])=>it(m[k])))return alert('Open Settings, Excel template, and choose an item for each column first.');
 const ss=LS(S.gl);if(ss.length>709)return alert('The template holds 709 students at most.');
 const t=await db.doc('cfg/template').get();if(!t.exists)return alert('Upload the template in Settings first.');
 try{
  const zip=await JSZip.loadAsync(t.data().b64,{base64:true}),P='xl/worksheets/sheet',rd=f=>{const z=zip.file(f);if(!z)throw new Error('Template is missing '+f);return z.async('string')};
  let xml=await rd(P+'1.xml');
  const formulaCountBefore=(xml.match(/<f\b/g)||[]).length,rowCountBefore=(xml.match(/<row\b/g)||[]).length;

  const xr=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const xe=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const cleanAttrs=a=>(' '+String(a||'').trim()).replace(/\s+t="[^"]*"/g,'').replace(/^\s*/,' ');

  // Microsoft Excel is much stricter than Google Sheets about the Shared String Table.
  // Earlier LabTrack builds changed many template cells from shared strings to inlineStr
  // while leaving the template's sharedStrings metadata unchanged. Google Sheets repairs
  // that silently, but Excel can reject the package. V10 keeps Excel-style shared strings.
  const sstPath='xl/sharedStrings.xml',sstFile=zip.file(sstPath);
  if(!sstFile)throw new Error('Template is missing xl/sharedStrings.xml');
  let sstXml=await sstFile.async('string');
  const sstDoc=new DOMParser().parseFromString(sstXml,'application/xml');
  if(sstDoc.getElementsByTagName('parsererror').length)throw new Error('Template sharedStrings.xml is invalid.');
  const sis=[...sstDoc.getElementsByTagName('si')],sharedMap=new Map();
  sis.forEach((si,i)=>{const txt=[...si.getElementsByTagName('t')].map(x=>x.textContent||'').join('');if(!sharedMap.has(txt))sharedMap.set(txt,i)});
  const addedStrings=[];
  const sharedIndex=v=>{v=String(v??'');if(sharedMap.has(v))return sharedMap.get(v);const i=sis.length+addedStrings.length;sharedMap.set(v,i);addedStrings.push(v);return i};

  const make=(ref,attrs,v,kind='auto')=>{attrs=cleanAttrs(attrs||('r="'+ref+'"'));if(!/\br="[^"]+"/.test(attrs))attrs+=' r="'+ref+'"';
   if(v===''||v==null)return '<c'+attrs+'></c>';
   if(kind==='text'){const i=sharedIndex(v);return '<c'+attrs+' t="s"><v>'+i+'</v></c>'}
   const n=typeof v==='number'?v:(typeof v==='string'&&/^-?\d+(?:\.\d+)?$/.test(v.trim())?+v:NaN);
   if(kind==='number'||!Number.isNaN(n))return '<c'+attrs+'><v>'+String(kind==='number'?+v:n)+'</v></c>';
   const i=sharedIndex(v);return '<c'+attrs+' t="s"><v>'+i+'</v></c>'};
  const patchCell=(row,ref,v,kind='auto')=>{
   const re=new RegExp('<c\\b([^>]*\\br="'+xr(ref)+'"[^>]*)\\s*\\/>|<c\\b([^>]*\\br="'+xr(ref)+'"[^>]*)>([\\s\\S]*?)<\\/c>');
   const hit=row.match(re);if(!hit)throw new Error('Template cell '+ref+' is missing.');
   return row.replace(re,make(ref,hit[1]||hit[2],v,kind));
  };

  const mx=k=>+it(m[k]).max||0,G=mx('mid')+mx('cw')+mx('pr'),mc=ss.map(calc);
  const val=(s,k,x)=>{const g=(s.g||{})[k],i=it(k);return i.t=='in'&&typeof g=='string'&&g!==''?g:x[k]};
  const heads={
   1:[['B1',cr.univ,'text'],['D1',cr.prog,'text'],['O1',cr.sem,'text']],
   2:[['E2',cr.code,'text'],['H2',cr.name,'text'],['M2',cr.ch,'auto'],['O2',cr.inst,'text']],
   4:[['D4',mx('mid'),'number'],['E4',mx('cw'),'number'],['F4',mx('pr'),'number'],['G4',G,'number'],['H4',mx('fin'),'number'],['I4',G+mx('fin'),'number']]
  };
  const unyellow={65:47,66:61,67:89,68:48,69:24,70:25,71:26,72:51,73:31,74:34,75:46,76:33,77:28,78:29,79:32,80:0,81:0};
  const clearManualYellow=row=>row.replace(/(<c\b[^>]*\bs=")(\d+)("[^>]*>)/g,(a,p,n,q)=>unyellow[n]!==undefined?p+unyellow[n]+q:a);

  xml=xml.replace(/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<\/row>/g,(row,rn)=>{
   const n=+rn;if(heads[n]){for(const [ref,v,k] of heads[n])row=patchCell(row,ref,v,k);return row}
   if(n<5||n>713)return row;row=clearManualYellow(row);
   const i=n-5,s=ss[i],x=mc[i];
   if(s){
    const ch=[['A'+n,s.sn===''||isNaN(+s.sn)?i+1:+s.sn,'auto'],['B'+n,s.sid??'','text'],['C'+n,s.nm??'','text'],
     ['D'+n,val(s,m.mid,x),'auto'],['E'+n,val(s,m.cw,x),'auto'],['F'+n,val(s,m.pr,x),'auto'],['H'+n,val(s,m.fin,x),'auto'],
     ['M'+n,s.st&&s.st!=SL[0]?s.st:'','text']];
    for(const [ref,v,k] of ch)row=patchCell(row,ref,v,k);
   }else for(const col of ['A','B','C','D','E','F','H','M'])row=patchCell(row,col+n,'');
   return row;
  });

  const lastDataRow=Math.max(5,4+ss.length);
  const dynamicCountifRanges=(sheetXml,allowLocal)=>sheetXml.replace(/<f\b([^>]*)>([\s\S]*?)<\/f>/g,(whole,attrs,formula)=>{
   if(!/\bCOUNTIFS?\s*\(/i.test(formula))return whole;
   const changed=formula.replace(/((?:'Program_Course Code'!)?)(\$?)([A-Z]{1,3})(\$?)\d+:(\$?)([A-Z]{1,3})(\$?)\d+/g,(ref,prefix,a1,c1,r1,a2,c2,r2)=>{
    if(c1!==c2)return ref;if(!prefix&&!allowLocal)return ref;
    return prefix+a1+c1+r1+'5:'+a2+c2+r2+lastDataRow;
   });
   return '<f'+attrs+'>'+changed+'</f>';
  });
  xml=dynamicCountifRanges(xml,true);

  const formulaCountAfter=(xml.match(/<f\b/g)||[]).length,rowCountAfter=(xml.match(/<row\b/g)||[]).length;
  if(formulaCountAfter!==formulaCountBefore)throw new Error('Formula integrity check failed. No Excel file was created.');
  if(rowCountAfter!==rowCountBefore)throw new Error('Worksheet row integrity check failed. No Excel file was created.');
  const chk=new DOMParser().parseFromString(xml,'application/xml');
  if(chk.getElementsByTagName('parsererror').length)throw new Error('Generated worksheet XML is invalid. No Excel file was created.');
  zip.file(P+'1.xml',xml);

  // Update only the COUNTIF/COUNTIFS ranges in the statistic sheets. V10 deliberately
  // keeps Excel's cached formula results and calcChain intact; the formula cells are
  // the same cells as in the template and Excel can recalculate them on open.
  for(let k=2;k<=5;k++){
   const path=P+k+'.xml',sx=dynamicCountifRanges(await rd(path),false);
   const parsed=new DOMParser().parseFromString(sx,'application/xml');
   if(parsed.getElementsByTagName('parsererror').length)throw new Error('Statistics sheet '+k+' became invalid. No Excel file was created.');
   zip.file(path,sx);
  }

  // Append any new strings to the template's Shared String Table. count/uniqueCount are
  // optional OOXML attributes, so remove them instead of leaving stale values after the
  // roster was shortened/changed. This is the key Excel-compatibility repair in V10.
  if(addedStrings.length){
   const extra=addedStrings.map(v=>'<si><t xml:space="preserve">'+xe(v)+'</t></si>').join('');
   sstXml=sstXml.replace(/<\/sst>\s*$/,extra+'</sst>');
  }
  sstXml=sstXml.replace(/(<sst\b[^>]*?)\s+count="[^"]*"/,'$1').replace(/(<sst\b[^>]*?)\s+uniqueCount="[^"]*"/,'$1');
  const sstCheck=new DOMParser().parseFromString(sstXml,'application/xml');
  if(sstCheck.getElementsByTagName('parsererror').length)throw new Error('Generated sharedStrings.xml is invalid. No Excel file was created.');
  zip.file(sstPath,sstXml);

  // Keep the original calcChain and package relationships. We only request a fresh
  // calculation; we do not delete Excel package parts or cached results.
  const wbPath='xl/workbook.xml',wbFile=zip.file(wbPath);if(wbFile){let wx=await wbFile.async('string');if(/<calcPr\b[^>]*\/>/.test(wx))wx=wx.replace(/<calcPr\b([^>]*)\/>/,(a,x)=>'<calcPr'+x.replace(/\s+(calcMode|fullCalcOnLoad|forceFullCalc|calcOnSave)="[^"]*"/g,'')+' calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1" calcOnSave="1"/>');else wx=wx.replace('</workbook>','<calcPr calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1" calcOnSave="1"/></workbook>');zip.file(wbPath,wx)}

  const out=await zip.generateAsync({type:'uint8array',compression:'DEFLATE',compressionOptions:{level:6},platform:'DOS'}),b=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a'),url=URL.createObjectURL(b);
  a.href=url;a.download=(cr.code||'Course')+'_Course_Grading.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){console.error(e);alert('LabTrack v19 — Excel export failed safely: '+e.message)}
}
boot();
</script></body></html>
