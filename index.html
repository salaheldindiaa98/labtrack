<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabTrack</title>
<style>
:root{--bg:#eceff3;--c:#fff;--t:#14213d;--m:#66718a;--p:#2b4acb;--b:#d3d9e3;--r:#b42318;--g:#067647}
*{box-sizing:border-box}body{margin:0;font:15px Roboto,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--t);color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.3px;margin-right:auto}header small{color:#aab4cc}
nav{display:flex;gap:6px;padding:8px 12px;background:var(--c);border-bottom:1px solid var(--b)}nav button{flex:1}
main{padding:12px;max-width:1100px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:12px}
h2,h3{margin:0 0 8px}
button{font:inherit;border:0;border-radius:6px;padding:8px 12px;background:var(--p);color:#fff}
button.g,nav button{background:#e3e8f0;color:var(--t)}nav button.on{background:var(--p);color:#fff}button.d{background:var(--r)}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--b);border-radius:6px;background:#fff;color:var(--t);max-width:100%}
label{display:block;margin:8px 0;color:var(--m);font-size:13px}label input,label select{display:block;width:100%;margin-top:3px}
.ck{display:flex;gap:8px;align-items:center;color:var(--t);font-size:15px}.ck input{width:auto;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.row label{margin:0}
.w{overflow-x:auto;border:1px solid var(--b);border-radius:6px;background:var(--c)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;border-bottom:1px solid var(--b);white-space:nowrap;text-align:center}
th{background:#e8ecf3;font-size:12px}td.n,th.n{text-align:left;position:sticky;left:0;border-right:1px solid var(--b)}td.n{background:#fff}th.n{background:#e8ecf3}
td input{width:64px;padding:5px;text-align:center}td.k{background:#eef1f7}
.s{width:36px;height:34px;padding:0;background:#e3e8f0;color:var(--t);font-size:16px}.s.P{background:#d1fadf;color:var(--g)}.s.A{background:#fee4e2;color:var(--r)}.s.X{background:#dbeafe;color:#1d4ed8}
.scorebox{display:flex;gap:4px;align-items:center;justify-content:center}.scorebox input{width:62px}.absbtn{padding:5px 6px;border:1px solid var(--b);background:#fff;color:var(--m);font-size:11px}.absbtn.on{background:#fee4e2;color:var(--r);border-color:#f3b4ae;font-weight:700}.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;background:#eef1f7;color:var(--m);font-size:12px}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.warn{background:#fff3cd;color:#8a5b00}.warnbtn{padding:4px 7px;background:#fff3cd;color:#8a5b00;border:1px solid #f1d58a;font-size:12px}.weekdate{display:block;font-size:10px;color:var(--m);font-weight:400;margin-top:2px}.visitlist{border:1px solid #bfdbfe;background:#eff6ff;border-radius:6px;padding:8px;margin-top:8px}.visititem{display:flex;gap:8px;align-items:center;padding:4px 0}.visititem span{flex:1}.policy{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.flagname{box-shadow:inset 4px 0 #f59e0b}.compact{max-width:150px}
.focusov{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto}
.focuspanel{min-height:100%;max-width:860px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.focushead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.focushead .grow{flex:1}.focushead h2{margin:0}.focushead .m{display:block;margin-top:2px}
.focusprogress{height:8px;background:#dfe4ec;border-radius:999px;overflow:hidden}.focusprogress>span{display:block;height:100%;background:var(--p);transition:width .18s ease}
.focuscard{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:clamp(20px,5vw,42px);box-shadow:0 12px 30px #14213d18;text-align:center;margin:auto 0}
.focusserial{font-size:14px;color:var(--m);margin-bottom:8px}.focusid{font-size:clamp(28px,8vw,62px);font-weight:800;letter-spacing:.02em;line-height:1.05;word-break:break-word}.focusname{font-size:clamp(24px,6vw,44px);font-weight:700;line-height:1.12;margin-top:14px}.focusmeta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}.focusstatus{margin:18px auto 0;font-weight:700;min-height:22px}
.focusactions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.focusactions button{min-height:82px;font-size:clamp(19px,4vw,26px);font-weight:700}.focusactions .present{background:var(--g)}.focusactions .absent{background:var(--r)}
.focusgrade{max-width:420px;margin:22px auto 0}.focusgrade input{width:100%;font-size:clamp(34px,9vw,58px);font-weight:700;text-align:center;padding:16px;border-width:2px}.focusgrade .max{font-size:16px;color:var(--m);margin-top:6px}.focusgradeactions{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:12px}.focusgradeactions button{min-height:58px;font-size:18px;font-weight:700}.focusgradeactions .absent{background:var(--r)}
.focusnav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}.focusnav button{min-width:110px}.focusdone{padding:40px 12px;text-align:center}.focusdone .big{font-size:54px}.focusdone h2{font-size:32px;margin:8px 0}
@media(max-width:520px){.focuspanel{padding:10px}.focuscard{border-radius:14px}.focusactions{grid-template-columns:1fr}.focusactions button{min-height:72px}.focusgradeactions{grid-template-columns:1fr}.focushead button{padding:8px 10px}}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}.ov .card{width:100%;max-width:420px;max-height:90vh;overflow:auto;margin:0}
pre{background:#e8ecf3;padding:8px;border-radius:6px;overflow:auto;font-size:12px}
.e{color:var(--r)}.m{color:var(--m);font-size:13px}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const APP_VERSION='8.0';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rng=n=>Array.from({length:n},(_,i)=>i+1),FV=()=>firebase.firestore.FieldValue.delete();
const DEF=[['att','Attendance','att',10],['pe1','Practical exam 1','in',10],['pe2','Practical exam 2','in',10],['ex1','Exam 1','in',10],['ex2','Exam 2','in',10],['ex3','Exam 3','in',10],['pf','Portfolio','in',10],['fin','Final grade','in',40]].map(([k,n,t,max])=>({k,n,t,max,mode:'ratio',pen:1}));
let S={tab:'att',lab:'',gl:'',aw:1,gfk:'',admin:false,cfg:null,labs:[],studs:[],user:null},db,auth,started,FO=null;

/* ---------- start-up, setup, login ---------- */
const CFG={apiKey:"AIzaSyAxgPrBcVszBieseQXfaz5JqcO_UAAopg0",authDomain:"labtrack-c55fb.firebaseapp.com",projectId:"labtrack-c55fb",storageBucket:"labtrack-c55fb.firebasestorage.app",messagingSenderId:"561200653207",appId:"1:561200653207:web:e7cb27d82c1b97e3575ad2"};
function boot(){const c=localStorage.fbc||JSON.stringify(CFG);
 try{firebase.initializeApp(JSON.parse(c));auth=firebase.auth();db=firebase.firestore()}catch(e){return setup('Config problem: '+e.message)}
 auth.onAuthStateChanged(u=>{S.user=u;u?start():login()})}
function setup(err=''){$('#app').innerHTML=`<main><div class=card><h2>LabTrack setup</h2>
<p class=m>1. At firebase.google.com create a project and add a Web app. Copy its firebaseConfig.<br>2. Build, Authentication: enable Email/Password, then add each instructor under Users.<br>3. Build, Firestore Database: create it, open Rules, paste this and Publish.</p>
<pre>rules_version = '2';
service cloud.firestore {
 match /databases/{d}/documents {
  match /{x=**} {
   allow read, write: if request.auth != null;
  }
 }
}</pre>
<label>Paste your firebaseConfig here<textarea id=cfgt rows=7 style="width:100%"></textarea></label>
<p class=e>${esc(err)}</p><button onclick=saveCfg()>Save and continue</button></div></main>`}
function saveCfg(){const o={};for(const m of $('#cfgt').value.matchAll(/(\w+)\s*:\s*["']([^"']+)["']/g))o[m[1]]=m[2];
 if(!o.apiKey||!o.projectId)return setup('apiKey or projectId not found. Paste the whole config.');localStorage.fbc=JSON.stringify(o);location.reload()}
function login(err=''){$('#app').innerHTML=`<main><div class=card><h2>LabTrack</h2><label>Email<input id=em type=email></label><label>Password<input id=pw type=password></label>
<p class=e>${esc(err)}</p><div class=row><button onclick=signIn()>Sign in</button><button class=g onclick="localStorage.removeItem('fbc');location.reload()">Change Firebase setup</button></div>
<p class=m>The first person to sign in becomes the admin.</p></div></main>`}
function signIn(){auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>login(e.message))}
function start(){if(started)return;started=1;
 db.doc('cfg/main').onSnapshot(d=>{if(!d.exists)return d.ref.set({weeks:12,locked:{},items:DEF,admins:[S.user.uid],altLabLimit:2,absenceWarn:3});S.cfg=d.data();S.admin=(S.cfg.admins||[]).includes(S.user.uid);const p={};if(S.cfg.altLabLimit==null)p.altLabLimit=2;if(S.cfg.absenceWarn==null)p.absenceWarn=3;if(Object.keys(p).length)d.ref.set(p,{merge:true});if(S.aw>S.cfg.weeks)S.aw=S.cfg.weeks;render()},e=>alert(e.message));
 db.collection('labs').onSnapshot(q=>{S.labs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{numeric:true}));if(!S.labs.find(l=>l.id===S.lab))S.lab=S.labs[0]?.id||'';render()});
 db.collection('students').onSnapshot(q=>{S.studs=q.docs.map(d=>({_:d.id,...d.data()}));render()})}

/* ---------- helpers ---------- */
const LS=l=>S.studs.filter(s=>!l||s.lab===l).sort((a,b)=>String(a.sn).localeCompare(String(b.sn),undefined,{numeric:true})||String(a.nm).localeCompare(String(b.nm)));
const St=id=>db.collection('students').doc(id),Cf=()=>db.doc('cfg/main');
const norm=x=>String(x??'').trim().toLowerCase(),labName=id=>S.labs.find(l=>l.id===id)?.name||'another lab';
const attN=s=>rng(S.cfg.weeks).filter(w=>['P','X'].includes((s.att||{})[w])).length;
const absN=s=>rng(S.cfg.weeks).filter(w=>(s.att||{})[w]=='A').length;
const altN=s=>rng(S.cfg.weeks).filter(w=>(s.att||{})[w]=='X').length;
const shortDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
function calc(s){const m={},it=S.cfg.items,g=s.g||{};
 const v=k=>{if(k in m)return m[k];const i=it.find(x=>x.k===k);m[k]=null;if(!i)return null;let r=null;
  if(i.t=='in'){const q=g[k];r=q==='Abs'?0:q===undefined||q===''||isNaN(+q)?null:+q}
  else if(i.t=='att'){const p=attN(s),b=absN(s);r=i.mode=='pen'?Math.max(0,i.max-b*i.pen):p/S.cfg.weeks*i.max}
  else if(i.t=='grp'){let xs=(i.src||[]).map(v).filter(x=>x!==null).sort((a,b)=>b-a);if(i.top>0)xs=xs.slice(0,i.top);if(xs.length){r=xs.reduce((a,b)=>a+b,0);if(i.agg=='avg')r/=xs.length;r*=i.mul}}
  else if(i.t=='sum')r=(i.src||[]).reduce((a,k)=>a+(v(k)||0),0);
  return m[k]=r===null?null:Math.round(r*100)/100};
 it.forEach(i=>v(i.k));return m}

/* ---------- main view ---------- */
function render(){if(!S.cfg||!S.user)return;const a=document.activeElement,f=a&&a.dataset&&a.dataset.f;
 $('#app').innerHTML=`<header><b>LabTrack <span style="font-size:12px;opacity:.75">v8</span></b><small>${esc(S.user.email)}${S.admin?' (admin)':''}</small><button class=g onclick="auth.signOut().then(()=>location.reload())">Sign out</button></header>
<nav>${[['att','Attendance'],['gr','Grades'],['set','Settings']].map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${n}</button>`).join('')}</nav>
<main>${S.tab=='att'?vAtt():S.tab=='gr'?vGr():vSet()}</main>`;
 if(f){const e=document.querySelector(`[data-f="${f}"]`);e&&e.focus()}}

/* ---------- attendance ---------- */
function vAtt(){const l=S.labs.find(x=>x.id===S.lab),W=S.cfg.weeks,lim=Math.max(0,+S.cfg.altLabLimit||0),thr=Math.max(0,+S.cfg.absenceWarn||0);
 const top=`<div class=card><div class=row><select onchange="S.lab=this.value;render()">${S.labs.map(x=>`<option value="${x.id}" ${x.id===S.lab?'selected':''}>${esc(x.name)}</option>`).join('')||'<option>No labs yet</option>'}</select><button onclick=addLab()>Add lab</button>${l?'<button class=d onclick=delLab()>Remove lab</button>':''}</div>`;
 if(!l)return top+'<p class=m>Add your first lab to start.</p></div>';
 const visitors=S.studs.filter(s=>s.lab!==l.id&&(s.att||{})[S.aw]=='X'&&(s.alt||{})[S.aw]===l.id).sort((a,b)=>String(a.nm).localeCompare(String(b.nm)));
 const flagged=LS(l.id).filter(s=>absN(s)>thr).length;
 return top+`<div class=row><label>Place<input data-f=lp value="${esc(l.place)}" onchange="db.doc('labs/${l.id}').update({place:this.value})"></label>
<label>Session week<select class=compact onchange="S.aw=+this.value;render()">${rng(W).map(w=>`<option value="${w}" ${w===S.aw?'selected':''}>Week ${w}</option>`).join('')}</select></label>
<label>Session date<input type=date data-f=wd value="${esc((l.dates||{})[S.aw]||'')}" onchange="setWeekDate(${S.aw},this.value)"></label>
<button class=g onclick=startAttendanceFocus() ${S.cfg.locked?.[S.aw]&&!S.admin?'disabled':''}>Focus mode</button>
<button onclick=visitorModal() ${S.cfg.locked?.[S.aw]&&!S.admin?'disabled':''}>+ Visiting student</button>
${flagged?`<span class="badge warn">⚠ ${flagged} warning${flagged==1?'':'s'}</span>`:''}</div>
<div class=policy><span class="badge blue">Other-lab allowance: ${lim}</span><span class=badge>Warning after &gt; ${thr} absences</span></div>
<div class=row><input id=a1 data-f=a1 placeholder=Serial style=width:70px><input id=a2 data-f=a2 placeholder=ID style=width:110px><input id=a3 data-f=a3 placeholder=Name><button onclick=addSt()>Add student</button></div>
<div class=row><input type=file id=f1 hidden accept=".xlsx,.xls,.csv" onchange="imp(this,0)"><input type=file id=f2 hidden accept=".xlsx,.xls,.csv" onchange="imp(this,1)">
<button class=g onclick="$('#f1').click()">Sync lab roster (Excel)</button><button class=g onclick="$('#f2').click()">Upload serials (override)</button><button class=g onclick=exLab()>Export lab Excel</button></div>
<p class=m>Tap attendance to cycle present → absent → empty. ↗ means the student attended a different lab and counts as present. Use “+ Visiting student” in the lab they actually attended.${S.admin?' Tap a week header to lock or unlock it.':''}</p>
${visitors.length?`<div class=visitlist><b>Visitors in Week ${S.aw}${(l.dates||{})[S.aw]?' · '+esc(shortDate((l.dates||{})[S.aw])):''}</b>${visitors.map(s=>`<div class=visititem><span>${esc(s.nm)} <span class=m>(${esc(s.sid||'no ID')} · home: ${esc(labName(s.lab))})</span></span><button class=g onclick="clearVisitor('${s._}',${S.aw})" ${S.cfg.locked?.[S.aw]&&!S.admin?'disabled':''}>Remove</button></div>`).join('')}</div>`:''}</div>
<div class=w><table><tr><th>#<th>ID<th class=n>Name${rng(W).map(w=>`<th onclick="lock(${w})" ${S.admin?'style=cursor:pointer':''}>W${w}${S.cfg.locked?.[w]?' 🔒':''}<span class=weekdate>${esc(shortDate((l.dates||{})[w]))}</span>`).join('')}<th>Att<th>Abs<th>Other</tr>
${LS(l.id).map(s=>{const a=s.att||{},ac=attN(s),bc=absN(s),xc=altN(s),flag=bc>thr;
 return `<tr><td>${esc(s.sn)}<td>${esc(s.sid)}<td class="n ${flag?'flagname':''}">${esc(s.nm)}${rng(W).map(w=>{const v=a[w]||'',title=v=='X'?`Attended in ${labName((s.alt||{})[w])}`:'';return `<td><button title="${esc(title)}" class="s ${v}" ${S.cfg.locked?.[w]&&!S.admin?'disabled':''} onclick="mark('${s._}',${w},'${v}')">${v=='P'?'✓':v=='A'?'✕':v=='X'?'↗':'·'}</button>`}).join('')}<td>${ac}<td>${flag?`<button class=warnbtn onclick="warnStudent('${s._}')">⚠ ${bc}</button>`:bc}<td><span class="badge ${xc>=lim&&lim>0?'warn':'blue'}">${xc}/${lim}</span>`}).join('')}</table></div>`}
function setWeekDate(w,v){if(S.lab)db.doc('labs/'+S.lab).update({['dates.'+w]:v})}
function mark(id,w,cur){let n=cur==''?'P':cur=='P'?'A':'';const u={['att.'+w]:n==''?FV():n,['alt.'+w]:FV()};St(id).update(u)}
function lock(w){if(S.admin)Cf().update({['locked.'+w]:!S.cfg.locked?.[w]})}
function addLab(){const n=prompt('Lab name or number');if(n)db.collection('labs').add({name:n.trim(),place:'',dates:{}}).then(r=>{S.lab=r.id})}
function delLab(){if(!confirm('Remove this lab and all its students?'))return;const b=db.batch();LS(S.lab).forEach(s=>b.delete(St(s._)));b.delete(db.doc('labs/'+S.lab));b.commit()}
function addSt(){const n=$('#a3').value.trim(),i=$('#a2').value.trim();if(!n&&!i)return;db.collection('students').add({lab:S.lab,sn:$('#a1').value.trim(),sid:i,nm:n,att:{},alt:{},g:{}})}
function delSt(id){if(confirm('Remove this student?'))St(id).delete()}
function visitorModal(){const l=S.labs.find(x=>x.id===S.lab),w=S.aw;if(!l)return;if(S.cfg.locked?.[w]&&!S.admin)return alert('This week is locked.');const pool=S.studs.filter(s=>s.lab!==S.lab).sort((a,b)=>String(a.nm).localeCompare(String(b.nm)));
 if(!pool.length)return alert('There are no students in other labs.');$('#modal').innerHTML=`<div class=ov><div class=card><h3>Add visiting student</h3><p class=m>Week ${w}${(l.dates||{})[w]?' · '+esc(shortDate((l.dates||{})[w])):''} · attending ${esc(l.name)}</p><input id=vq placeholder="Search ID or name" oninput="filterVisitor(this.value)" style="width:100%"><label>Student<select id=vs size=8 style="height:220px">${pool.map(s=>`<option value="${s._}" data-q="${esc(norm((s.sid||'')+' '+(s.nm||'')+' '+labName(s.lab)))}">${esc(s.sid||'—')} — ${esc(s.nm)} — ${esc(labName(s.lab))}</option>`).join('')}</select></label><div class=row><button onclick=saveVisitor()>Mark attended here</button><button class=g onclick="$('#modal').innerHTML=''">Cancel</button></div></div></div>`}
function filterVisitor(q){q=norm(q);[...document.querySelectorAll('#vs option')].forEach(o=>o.hidden=q&&!o.dataset.q.includes(q))}
function saveVisitor(){const id=$('#vs')?.value,s=S.studs.find(x=>x._===id),w=S.aw,lim=Math.max(0,+S.cfg.altLabLimit||0);if(!s)return alert('Choose a student.');const cur=(s.att||{})[w]||'',used=altN(s);if(cur!='X'&&used>=lim)return alert(`${s.nm} has already used ${used}/${lim} other-lab attendances.`);if(lim<1&&cur!='X')return alert('Other-lab attendance allowance is currently 0.');if(cur=='P'&&!confirm('This student is already marked present in the home lab for this week. Replace it with attendance in this lab?'))return;St(id).update({['att.'+w]:'X',['alt.'+w]:S.lab}).then(()=>{$('#modal').innerHTML=''})}
function clearVisitor(id,w){if(S.cfg.locked?.[w]&&!S.admin)return;St(id).update({['att.'+w]:FV(),['alt.'+w]:FV()})}
async function warnStudent(id){const s=S.studs.find(x=>x._===id);if(!s)return;const n=absN(s),t=Math.max(0,+S.cfg.absenceWarn||0),msg=`Attendance warning: ${s.nm}${s.sid?' ('+s.sid+')':''} has ${n} recorded absences, exceeding the course threshold of ${t}. Please review your attendance record.`;try{if(navigator.share){await navigator.share({title:'Attendance warning',text:msg});return}if(navigator.clipboard){await navigator.clipboard.writeText(msg);alert('Warning copied. You can paste it into WhatsApp, email, or another message.');return}}catch(e){if(e?.name==='AbortError')return}prompt('Copy this warning:',msg)}

/* ---------- Excel import / export ---------- */
function parse(rows){if(!rows.length)return[];const h=rows[0].map(x=>String(x).toLowerCase().trim()),f=r=>h.findIndex(x=>r.test(x));
 let c={sn:f(/serial|^sn$|^no\.?$|^#$/),sid:f(/\bid\b|code/),nm:f(/name/)},st=1;if(c.sid<0&&c.nm<0){st=0;c=rows[0].length>2?{sn:0,sid:1,nm:2}:{sn:-1,sid:0,nm:1}}
 return rows.slice(st).filter(r=>r.some(x=>x!=='')).map(r=>({sn:c.sn<0?'':String(r[c.sn]??'').trim(),sid:c.sid<0?'':String(r[c.sid]??'').trim(),nm:c.nm<0?'':String(r[c.nm]??'').trim()}))}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=db.batch();for(const o of ops.slice(i,i+400)){if(o.t=='delete')b.delete(o.ref);else if(o.t=='set')b.set(o.ref,o.data);else b.update(o.ref,o.data)}await b.commit()}}

  // The source template has a handful of manually yellow-highlighted student rows.
  // These style IDs are the matching non-yellow styles from the same template.
  const unyellow={65:47,66:61,67:89,68:48,69:24,70:25,71:26,72:51,73:31,74:34,75:46,76:33,77:28,78:29,79:32,80:0,81:0};
  const clearManualYellow=row=>row.replace(/(<c\b[^>]*\bs=")(\d+)("[^>]*>)/g,(a,p,n,q)=>unyellow[n]!==undefined?p+unyellow[n]+q:a);

  xml=xml.replace(/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<\/row>/g,(row,rn)=>{
   const n=+rn;if(heads[n]){for(const [ref,v,k] of heads[n])row=patchCell(row,ref,v,k);return row}
   if(n<5||n>713)return row;row=clearManualYellow(row);
   const i=n-5,s=ss[i],x=mc[i];
   if(s){
    const ch=[['A'+n,s.sn===''||isNaN(+s.sn)?i+1:+s.sn,'auto'],['B'+n,s.sid??'','text'],['C'+n,s.nm??'','text'],
     ['D'+n,val(s,m.mid,x),'auto'],['E'+n,val(s,m.cw,x),'auto'],['F'+n,val(s,m.pr,x),'auto'],['H'+n,val(s,m.fin,x),'auto'],
     ['M'+n,s.st&&s.st!=SL[0]?s.st:'','text']];
    for(const [ref,v,k] of ch)row=patchCell(row,ref,v,k);
   }else for(const col of ['A','B','C','D','E','F','H','M'])row=patchCell(row,col+n,'');
   return row;
  });

  // Every COUNTIF/COUNTIFS data range now ends at the last exported student.
  // Student data always starts on row 5. This also normalizes old template ranges
  // that accidentally began on row 3 or 4. Single-cell references such as H4/G4
  // (maximum marks) are intentionally left unchanged.
  const lastDataRow=Math.max(5,4+ss.length);
  const dynamicCountifRanges=(sheetXml,allowLocal)=>sheetXml.replace(/<f\b([^>]*)>([\s\S]*?)<\/f>/g,(whole,attrs,formula)=>{
   if(!/\bCOUNTIFS?\s*\(/i.test(formula))return whole;
   const changed=formula.replace(/((?:'Program_Course Code'!)?)(\$?)([A-Z]{1,3})(\$?)\d+:(\$?)([A-Z]{1,3})(\$?)\d+/g,(ref,prefix,a1,c1,r1,a2,c2,r2)=>{
    if(c1!==c2)return ref;
    if(!prefix&&!allowLocal)return ref;
    return prefix+a1+c1+r1+'5:'+a2+c2+r2+lastDataRow;
   });
   return '<f'+attrs+'>'+changed+'</f>';
  });
  xml=dynamicCountifRanges(xml,true);

  const formulaCountAfter=(xml.match(/<f\b/g)||[]).length,rowCountAfter=(xml.match(/<row\b/g)||[]).length;
  if(formulaCountAfter!==formulaCountBefore)throw new Error('Formula integrity check failed. No Excel file was created.');
  if(rowCountAfter!==rowCountBefore)throw new Error('Worksheet row integrity check failed. No Excel file was created.');
  const chk=new DOMParser().parseFromString(xml,'application/xml');
  if(chk.getElementsByTagName('parsererror').length)throw new Error('Generated worksheet XML is invalid. No Excel file was created.');
  // Cached formula results belong to the old template data. Remove them safely so
  // Excel/Sheets recomputes formulas from the newly exported grades instead of seeing stale values.
  const clearFormulaCaches=sx=>sx.replace(/<c\b([^>]*?)\/>|<c\b([^>]*?)>([\s\S]*?)<\/c>/g,(whole,selfAttrs,attrs,body)=>{
   if(selfAttrs!==undefined||!body||!/<f\b/.test(body))return whole;
   return '<c'+attrs+'>'+body.replace(/<v>[\s\S]*?<\/v>/g,'')+'</c>';
  });
  xml=clearFormulaCaches(xml);
  zip.file(P+'1.xml',xml);

  // Apply the same dynamic COUNTIF/COUNTIFS ranges to all four statistics sheets.
  // Their formulas continue to point at Program_Course Code, but only through the
  // final populated student row instead of the template's fixed row 713.
  for(let k=2;k<=5;k++){
   const path=P+k+'.xml',sx=clearFormulaCaches(dynamicCountifRanges(await rd(path),false));
   const parsed=new DOMParser().parseFromString(sx,'application/xml');
   if(parsed.getElementsByTagName('parsererror').length)throw new Error('Statistics sheet '+k+' became invalid. No Excel file was created.');
   zip.file(path,sx);
  }

  // Formula text changed, so discard Excel's stale calculation chain and let Excel rebuild it.
  // This is safer for Microsoft Excel than keeping a calcChain created for the old formulas.
  zip.remove('xl/calcChain.xml');
  const relPath='xl/_rels/workbook.xml.rels',relFile=zip.file(relPath);if(relFile){let rx=await relFile.async('string');rx=rx.replace(/<Relationship\b[^>]*(?:Type="[^"]*\/calcChain"|Target="calcChain\.xml")[^>]*\/>/g,'');zip.file(relPath,rx)}
  const ctPath='[Content_Types].xml',ctFile=zip.file(ctPath);if(ctFile){let cx=await ctFile.async('string');cx=cx.replace(/<Override\b[^>]*PartName="\/xl\/calcChain\.xml"[^>]*\/>/g,'');zip.file(ctPath,cx)}
  const wbPath='xl/workbook.xml',wbFile=zip.file(wbPath);if(wbFile){let wx=await wbFile.async('string');if(/<calcPr\b[^>]*\/>/.test(wx))wx=wx.replace(/<calcPr\b([^>]*)\/>/,(a,x)=>'<calcPr'+x.replace(/\s+(calcMode|fullCalcOnLoad|forceFullCalc|calcOnSave)="[^"]*"/g,'')+' calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1" calcOnSave="1"/>');else wx=wx.replace('</workbook>','<calcPr calcMode="auto" fullCalcOnLoad="1" forceFullCalc="1" calcOnSave="1"/></workbook>');zip.file(wbPath,wx)}

  const out=await zip.generateAsync({type:'uint8array',compression:'DEFLATE'}),b=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),a=document.createElement('a'),url=URL.createObjectURL(b);
  a.href=url;a.download=(cr.code||'Course')+'_Course_Grading.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){console.error(e);alert('LabTrack v7 — Excel export failed safely: '+e.message)}
}
boot();
</script></body></html>
