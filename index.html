async function gateUser(u){loadingAccount();const ref=db.collection('instructors').doc(u.uid);try{
 let d=await ref.get(),p=d.exists?d.data():null;

  const legacyAdmin=cfg?.exists&&(cfg.data().admins||[]).includes(u.uid);
  p={name:u.displayName||u.email?.split('@')[0]||'Instructor',email:u.email||'',role:legacyAdmin?'admin':'instructor',approved:!!legacyAdmin,status:legacyAdmin?'approved':'pending',createdAt:ts()};await ref.set(p,{merge:true});d=await ref.get();p=d.data()
 }
 // Brand-new database only: the first LabTrack registrant becomes administrator.
 if(!p.approved&&p.status!=='rejected')try{const c=await db.doc('cfg/main').get();if(!c.exists){await db.doc('cfg/main').set(defaultCfg(u.uid));await ref.set({approved:true,status:'approved',role:'admin',approvedAt:ts(),approvedBy:u.uid},{merge:true});d=await ref.get();p=d.data()}}catch(_){}
 S.profile={id:u.uid,...p};watchOwnProfile(ref);
 if(S.profile.approved===true&&S.profile.status==='approved')return start();
 return S.profile.status==='rejected'?rejectedScreen():pendingScreen()
 }catch(e){console.error(e);$('#app').innerHTML=`<div class=authwrap><div class="card authcard accountstate"><div class=ico>⚠</div><h2>Account check failed</h2><p class=e>${esc(friendlyAuth(e))}</p><p class=m>If you just upgraded LabTrack, publish the current Firestore security rules from the admin Settings page.</p><button class=g onclick="auth.signOut()">Sign out</button></div></div>`}}

/* ---------- helpers ---------- */
const serialCmp=(a,b)=>{const A=String(a.sn??'').trim(),B=String(b.sn??'').trim();if(!A&&!B){}else if(!A)return 1;else if(!B)return -1;else{const an=/^[+-]?\d+(?:\.\d+)?$/.test(A)?+A:null,bn=/^[+-]?\d+(?:\.\d+)?$/.test(B)?+B:null;if(an!==null&&bn!==null&&an!==bn)return an-bn;const c=A.localeCompare(B,undefined,{numeric:true,sensitivity:'base'});if(c)return c}const id=String(a.sid??'').localeCompare(String(b.sid??''),undefined,{numeric:true,sensitivity:'base'});return id||String(a.nm??'').localeCompare(String(b.nm??''),undefined,{numeric:true,sensitivity:'base'})};
const LS=l=>S.studs.filter(s=>!l||s.lab===l).sort(serialCmp);
const allBySerial=()=>[...S.studs].sort(serialCmp);
const St=id=>db.collection('students').doc(id),Cf=()=>db.doc('cfg/main');
const norm=x=>String(x??'').trim().toLowerCase(),labName=id=>S.labs.find(l=>l.id===id)?.name||'another lab';
const attN=s=>rng(S.cfg.weeks).filter(w=>['P','X'].includes((s.att||{})[w])).length;
const absN=s=>rng(S.cfg.weeks).filter(w=>(s.att||{})[w]=='A').length;
const altN=s=>rng(S.cfg.weeks).filter(w=>(s.att||{})[w]=='X').length;
const shortDate=d=>{if(!d)return'';const x=new Date(d+'T00:00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
const studentMatch=(s,q)=>{q=norm(q);return !q||norm(s.sn).includes(q)||norm(s.sid).includes(q)||norm(s.nm).includes(q)};
const attStudents=()=>LS(S.lab).filter(s=>studentMatch(s,S.aq));
const attendanceUniversalMatches=()=>S.aq?allBySerial().filter(s=>studentMatch(s,S.aq)):[];
const gradeStudents=()=>focusList(S.gl).filter(s=>studentMatch(s,S.gq));
function calc(s){const m={},it=S.cfg.items,g=s.g||{};
 const v=k=>{if(k in m)return m[k];const i=it.find(x=>x.k===k);m[k]=null;if(!i)return null;let r=null;
  if(i.t=='in'){const q=g[k];r=q==='Abs'?0:q===undefined||q===''||isNaN(+q)?null:+q}
  else if(i.t=='att'){const p=attN(s),b=absN(s);r=i.mode=='pen'?Math.max(0,i.max-b*i.pen):p/S.cfg.weeks*i.max}
  else if(i.t=='grp'){let xs=(i.src||[]).map(v).filter(x=>x!==null).sort((a,b)=>b-a);if(i.top>0)xs=xs.slice(0,i.top);if(xs.length){r=xs.reduce((a,b)=>a+b,0);if(i.agg=='avg')r/=xs.length;r*=i.mul}}
  else if(i.t=='sum')r=(i.src||[]).reduce((a,k)=>a+(v(k)||0),0);
  return m[k]=r===null?null:Math.round(r*100)/100};
 it.forEach(i=>v(i.k));return m}

let detailScrollX=0,detailScrollMax=0,syncDrag=null,syncPaintRaf=0,syncInertiaRaf=0,syncSuppressClickUntil=0;
function detailMax(){const v=document.querySelector('.syncstrip'),i=v?.querySelector('.syncinner');return v&&i?Math.max(0,i.scrollWidth-v.clientWidth):0}
function paintDetailScroll(){syncPaintRaf=0;document.documentElement.style.setProperty('--detail-shift',(-detailScrollX)+'px')}
function setDetailScroll(x){detailScrollMax=detailMax();detailScrollX=Math.max(0,Math.min(detailScrollMax,Number.isFinite(x)?x:0));if(!syncPaintRaf)syncPaintRaf=requestAnimationFrame(paintDetailScroll)}

// Delayed capture makes grading scroll like attendance: tap controls normally, drag anywhere horizontally.
function syncDragStart(e,el){if(e.pointerType==='mouse'&&e.button!==0)return;stopSyncInertia();detailScrollMax=detailMax();syncDrag={id:e.pointerId,startX:e.clientX,startY:e.clientY,startScroll:detailScrollX,lastT:performance.now(),v:0,moved:false,captured:false,el,target:e.target}}
function syncDragMove(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const dx=e.clientX-syncDrag.startX,dy=e.clientY-syncDrag.startY;if(!syncDrag.moved){if(Math.abs(dx)<5)return;if(Math.abs(dy)>Math.abs(dx)*1.2)return;syncDrag.moved=true;syncSuppressClickUntil=performance.now()+320;syncDrag.el?.classList.add('dragging');if(syncDrag.target?.blur)syncDrag.target.blur();try{syncDrag.el?.setPointerCapture(e.pointerId);syncDrag.captured=true}catch(_){}}if(e.cancelable)e.preventDefault();const now=performance.now(),dt=Math.max(1,now-syncDrag.lastT),next=Math.max(0,Math.min(detailScrollMax,syncDrag.startScroll-dx)),prev=detailScrollX;setDetailScroll(next);syncDrag.v=(next-prev)/dt;syncDrag.lastT=now}
function syncDragEnd(e){if(!syncDrag||e.pointerId!==syncDrag.id)return;const d=syncDrag;d.el?.classList.remove('dragging');if(d.captured)try{d.el?.releasePointerCapture(e.pointerId)}catch(_){}syncDrag=null;if(d.moved){syncSuppressClickUntil=performance.now()+320;startSyncInertia(d.v)}}
function startSyncInertia(v){stopSyncInertia();if(Math.abs(v)<.05)return;let last=performance.now();const step=t=>{const dt=Math.min(32,t-last);last=t;const before=detailScrollX;setDetailScroll(detailScrollX+v*dt);if(detailScrollX===0||detailScrollX===detailScrollMax||Math.abs(detailScrollX-before)<.05)v=0;v*=Math.pow(.91,dt/16.67);if(Math.abs(v)>.02)syncInertiaRaf=requestAnimationFrame(step);else syncInertiaRaf=0};syncInertiaRaf=requestAnimationFrame(step)}
function syncWheel(e){const d=Math.abs(e.deltaX)>=Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);if(!d)return;if(e.cancelable)e.preventDefault();stopSyncInertia();setDetailScroll(detailScrollX+d)}

let QRSCAN={scanner:null,busy:false,last:'',lastAt:0,count:0,started:false,cameraId:''};
function qrSessionLabel(){const l=S.labs.find(x=>x.id===S.lab);return `${l?.name||'Lab'} · Week ${S.aw}${(l?.dates||{})[S.aw]?' · '+shortDate((l.dates||{})[S.aw]):''}`}
function qrBeep(ok=true){try{navigator.vibrate?.(ok?[60]:[80,60,80]);const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=qrBeep.ctx||(qrBeep.ctx=new C());if(c.state==='suspended')c.resume();const o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:220;g.gain.setValueAtTime(.055,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.11);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(_){}}

async function startQrAttendance(){const l=S.labs.find(x=>x.id===S.lab),w=S.aw;if(!l)return;if(S.cfg.locked?.[w]&&!S.admin)return alert('This week is locked.');if(typeof Html5Qrcode==='undefined')return alert('The QR scanner library did not load. Check your internet connection and reload LabTrack.');await stopQrAttendance(true);QRSCAN={scanner:null,busy:false,last:'',lastAt:0,count:0,started:false,cameraId:''};$('#modal').innerHTML=`<div class=qrscanov><div class=qrscanpanel><div class=qrscanhead><div class=grow><h2>QR attendance</h2><div class=qrscanmeta>${esc(qrSessionLabel())}${l.place?' · '+esc(l.place):''}</div></div><button class=qrscanclose onclick=stopQrAttendance()>Close</button></div><div class=qrcount><span>Point the camera toward the student's QR sticker — it can be anywhere on screen.</span><span>Marked this scan session: <b id=qrscancount>0</b></span></div><div class=qrview><div id=qr-reader></div><div class=qrguide></div></div><div class=qrscanhelp>The QR contains only the Student ID. The camera fills the screen and scans the whole frame. No alignment box is required. Scanning continues automatically.</div><div id=qrscanstatus class=qrstatus><div class=qrstatusicon>⌁</div><div class=qrstatustext><b>Starting camera…</b><span>Allow camera permission when your browser asks.</span></div></div></div></div>`;setTimeout(startQrCamera,80)}
function qrCameraError(e){const n=e?.name||'',m=e?.message||String(e||'');if(n==='NotAllowedError'||/permission|denied/i.test(m))return 'Camera permission is blocked for this site or browser.';if(n==='NotFoundError'||/not found|no camera/i.test(m))return 'No usable camera was found on this device.';if(n==='NotReadableError'||/could not start|track start|in use|hardware/i.test(m))return 'The camera may already be in use by another app or browser tab.';if(n==='OverconstrainedError')return 'The requested camera mode is not supported by this device.';return m||'The browser could not start the camera.'}
async function qrEnumerateCameras(){try{const probe=await navigator.mediaDevices.getUserMedia({video:true,audio:false});probe.getTracks().forEach(t=>t.stop());await new Promise(r=>setTimeout(r,120));const ds=await navigator.mediaDevices.enumerateDevices();return ds.filter(d=>d.kind==='videoinput')}catch(e){throw e}}
function qrPreferredCamera(cams){if(!cams.length)return null;const back=cams.find(c=>/back|rear|environment|world|camera\s*0/i.test(c.label||''));return back||cams[cams.length-1]}
function qrCameraControls(cams,selected){const head=document.querySelector('.qrscanhead');if(!head||!cams?.length)return;let sel=$('#qrcameraselect');if(!sel){const wrap=document.createElement('div');wrap.style.cssText='position:absolute;right:12px;top:calc(58px + env(safe-area-inset-top));z-index:5';wrap.innerHTML='<select id="qrcameraselect" aria-label="Camera" style="max-width:180px;background:#111827dd;color:#fff;border:1px solid #ffffff33;padding:7px 10px;border-radius:8px"></select>';head.parentElement.appendChild(wrap);sel=$('#qrcameraselect')}sel.innerHTML=cams.map((c,i)=>`<option value="${esc(c.deviceId)}" ${c.deviceId===selected?'selected':''}>${esc(c.label||('Camera '+(i+1)))}</option>`).join('');sel.onchange=()=>switchQrCamera(sel.value)}
async function startQrCamera(forceId=''){const box=$('#qrscanstatus');try{const el=$('#qr-reader');if(!el)return;if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera access is not supported in this browser.');if(box){box.className='qrstatus';box.innerHTML='<div class=qrstatusicon>⌁</div><div class=qrstatustext><b>Starting camera…</b><span>Checking available cameras.</span></div>'}const cams=await qrEnumerateCameras();if(!cams.length)throw Object.assign(new Error('No camera found.'),{name:'NotFoundError'});const preferred=forceId?cams.find(c=>c.deviceId===forceId)||qrPreferredCamera(cams):qrPreferredCamera(cams);QRSCAN.scanner=new Html5Qrcode('qr-reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});let lastErr=null;const tries=[];if(preferred?.deviceId)tries.push(preferred.deviceId);tries.push({facingMode:'environment'});for(const cam of tries){try{await QRSCAN.scanner.start(cam,{fps:20},qrDecoded,()=>{});lastErr=null;break}catch(e){lastErr=e;try{await QRSCAN.scanner.stop()}catch(_){}try{QRSCAN.scanner.clear()}catch(_){}QRSCAN.scanner=new Html5Qrcode('qr-reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false})}}if(lastErr)throw lastErr;QRSCAN.started=true;QRSCAN.cameraId=preferred?.deviceId||'';qrCameraControls(cams,QRSCAN.cameraId);qrShow('', 'Ready to scan', null, 'Show one student ID card at a time.')}catch(e){console.error('QR camera start failed',e);await stopQrCameraOnly();qrShow('err','Camera could not start',null,qrCameraError(e));const b=$('#qrscanstatus');if(b)b.insertAdjacentHTML('beforeend','<button class=qrretry onclick="restartQrCamera()">Try again</button>')}}
async function switchQrCamera(id){const box=$('#qrscanstatus');if(box){box.className='qrstatus';box.innerHTML='<div class=qrstatusicon>⌁</div><div class=qrstatustext><b>Switching camera…</b><span>Please wait.</span></div>'}await stopQrCameraOnly();setTimeout(()=>startQrCamera(id),120)}

async function stopQrCameraOnly(){const q=QRSCAN.scanner;QRSCAN.scanner=null;QRSCAN.started=false;if(q){try{await q.stop()}catch(_){}try{q.clear()}catch(_){}}document.querySelectorAll('#qr-reader video').forEach(v=>{try{v.srcObject?.getTracks?.().forEach(t=>t.stop())}catch(_){}})}

async function qrMarkStudent(studentId){const matches=S.studs.filter(s=>String(s.sid??'').trim()===studentId);if(!matches.length){qrBeep(false);qrShow('err','Student ID not found',null,studentId);return}if(matches.length>1){qrBeep(false);qrShow('err','Duplicate Student ID in LabTrack',null,`${studentId} matches ${matches.length} records. Fix the roster before scanning.`);return}const s=matches[0],w=S.aw,l=S.labs.find(x=>x.id===S.lab);if(!l){qrBeep(false);qrShow('err','No attendance lab selected',s);return}if(S.cfg.locked?.[w]&&!S.admin){qrBeep(false);qrShow('err',`Week ${w} is locked`,s);return}const cur=(s.att||{})[w]||'';
 if(s.lab===S.lab){if(cur==='X'){qrBeep(false);qrShow('warn','Already attended as a visiting student',s,'Week '+w+' · '+labName((s.alt||{})[w]));return}if(cur==='P'){qrShow('warn','Already marked present',s,`${labName(s.lab)} · Week ${w}`);return}await St(s._).update({['att.'+w]:'P',['alt.'+w]:FV()});QRSCAN.count++;qrBeep(true);qrShow('ok','Present',s,`${labName(s.lab)} · Week ${w}`);return}
 const lim=Math.max(0,+S.cfg.altLabLimit||0),used=altN(s),alreadyHere=cur==='X'&&(s.alt||{})[w]===S.lab;if(alreadyHere){qrShow('warn','Already marked here as a visiting student',s,`${labName(s.lab)} → ${l.name} · Other-lab ${used}/${lim}`);return}if(lim<1){qrBeep(false);qrShow('err','Other-lab attendance is disabled',s,`Home lab: ${labName(s.lab)}`);return}if(cur!=='X'&&used>=lim){qrBeep(false);qrShow('err','Other-lab allowance reached',s,`${used}/${lim} already used · Home lab: ${labName(s.lab)}`);return}await St(s._).update({['att.'+w]:'X',['alt.'+w]:S.lab});QRSCAN.count++;qrBeep(true);qrShow('ok','Present here as visiting student',s,`${labName(s.lab)} → ${l.name} · Other-lab ${cur==='X'?used:used+1}/${lim}`)}

function openQrStickers(){if(typeof QRCode==='undefined')return alert('The QR generator library did not load. Check your internet connection and reload LabTrack.');const scope=S.lab||'',list=(scope?LS(scope):allBySerial()).filter(s=>String(s.sid??'').trim());$('#modal').innerHTML=`<div class=qrprintov><div class=qrprintpanel><div class=qrprinthead><h2>Student QR stickers</h2><div class=qrprintscope><span class=m>Scope</span><select id=qrprintscope onchange="renderQrStickers(this.value)"><option value="">All labs</option>${S.labs.map(l=>`<option value="${l.id}" ${l.id===scope?'selected':''}>${esc(l.name)}</option>`).join('')}</select><button onclick=printQrStickers()>Print</button><button class=g onclick=closeQrStickers()>Close</button></div></div><p class=qrprintnote>Each printed sticker is QR-only. The printed QR itself is 18 mm square inside a 25 mm white square, giving it a clear quiet zone for faster scanning. The on-screen name/ID is only for matching stickers to students and is hidden when printing. QR content = exact Student ID.</p><div id=qrprintgrid class=qrprintgrid></div></div></div>`;renderQrStickers(scope)}

function parse(rows){if(!rows.length)return[];const h=rows[0].map(x=>String(x).toLowerCase().trim()),f=r=>h.findIndex(x=>r.test(x));
 let c={sn:f(/serial|^sn$|^no\.?$|^#$/),sid:f(/\bid\b|code/),nm:f(/name/)},st=1;if(c.sid<0&&c.nm<0){st=0;c=rows[0].length>2?{sn:0,sid:1,nm:2}:{sn:-1,sid:0,nm:1}}
 return rows.slice(st).filter(r=>r.some(x=>x!=='')).map(r=>({sn:c.sn<0?'':String(r[c.sn]??'').trim(),sid:c.sid<0?'':String(r[c.sid]??'').trim(),nm:c.nm<0?'':String(r[c.nm]??'').trim()}))}
/* Course serial files exported for this course may contain only ID + Name.
   In that format, the student's serial is the 1-based order of the data rows. */
function parseCourseSerials(rawRows){
 if(!rawRows.length)return {rows:[],source:'none'};
 const h=rawRows[0].map(x=>String(x??'').toLowerCase().trim());
 const hasSerial=h.some(x=>/serial|^sn$|^no\.?$|^#$/.test(x));
 const rows=parse(rawRows);
 if(hasSerial)return {rows,source:'column'};
 return {rows:rows.map((q,i)=>({...q,sn:String(i+1)})),source:'row-order'}
}
function parseSisRoster(text){
 const clean=v=>String(v??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(),out=[],seen=new Set();
 const add=(cells)=>{if(cells.length<3)return;const sid=clean(cells[1]),nm=clean(cells[2]);if(!sid||!nm||/^id$/i.test(sid)||/^name$/i.test(nm))return;const k=norm(sid);if(!k||seen.has(k))return;seen.add(k);out.push({sn:'',sid,nm})};
 try{const d=new DOMParser().parseFromString(String(text||''),'text/html');for(const tr of d.querySelectorAll('table tr'))add([...tr.children].filter(x=>/^(TD|TH)$/i.test(x.tagName)).map(x=>x.textContent||''))}catch(e){}
 if(out.length)return out;
 /* Oracle SIS exports an HTML table with an .xls extension and may omit closing </tr> tags. */
 const decode=x=>{const d=new DOMParser().parseFromString('<body>'+x+'</body>','text/html');return d.body.textContent||''};
 for(const part of String(text||'').split(/<tr\b[^>]*>/i).slice(1)){const cells=[...part.matchAll(/<t[dh]\b[^>]*>([\s\S]*?)<\/t[dh]>/gi)].map(m=>decode(m[1]));add(cells)}
 return out
}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=db.batch();for(const o of ops.slice(i,i+400)){if(o.t=='delete')b.delete(o.ref);else if(o.t=='set')b.set(o.ref,o.data);else b.update(o.ref,o.data)}await b.commit()}}
async function syncSisRoster(rows,inp){
 const col=db.collection('students'),pool=LS(S.lab),fileIds=new Set(rows.map(q=>norm(q.sid)).filter(Boolean)),keep=new Set(),adds=[];
 const existingById=new Map();for(const s of pool){const k=norm(s.sid);if(k&&!existingById.has(k))existingById.set(k,s)}
 for(const q of rows){const k=norm(q.sid),s=existingById.get(k);if(s)keep.add(s._);else adds.push(q)}
 const rem=pool.filter(s=>!fileIds.has(norm(s.sid)));
 if(!confirm(`Synchronize this lab from the original SIS .xls file?\n\nStudents read from SIS: ${rows.length}\nKeep unchanged: ${keep.size}\nAdd: ${adds.length}\nRemove: ${rem.length}\n\nExisting students keep their attendance, grades, serial number, and stored name.`)){inp.value='';return}
 const ops=[];rem.forEach(s=>ops.push({t:'delete',ref:col.doc(s._)}));adds.forEach(q=>ops.push({t:'set',ref:col.doc(),data:{lab:S.lab,sn:'',sid:q.sid,nm:q.nm,att:{},alt:{},g:{}}}));await commitOps(ops);
 alert(`SIS roster synchronized.\nRead: ${rows.length}\nKept unchanged: ${keep.size}\nAdded: ${adds.length}\nRemoved: ${rem.length}`)
}
function imp(inp,kind){const f=inp.files[0];if(!f)return;
 if(kind==0){
  if(!/\.xls$/i.test(f.name)){alert('Please upload the original SIS .xls roster file. No conversion to .xlsx is needed.');inp.value='';return}
  const r=new FileReader();r.onload=async e=>{try{const rows=parseSisRoster(e.target.result);if(!rows.length)throw new Error('No SIS students were found. Expected Student ID in column 2 and Name in column 3.');await syncSisRoster(rows,inp)}catch(x){alert('SIS roster import failed: '+x.message)}finally{inp.value=''}};r.onerror=()=>{alert('Could not read the SIS .xls file.');inp.value=''};r.readAsText(f,'utf-8');return
 }
 const r=new FileReader();r.onload=async e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),rawRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),parsed=parseCourseSerials(rawRows),rows=parsed.rows,col=db.collection('students');
  if(!rows.length)throw new Error('No students were found in the serial file.');
  const sourceNote=parsed.source==='row-order'?`No Serial column was found. LabTrack will use the file order as the course serial: 1 to ${rows.length}.`:'LabTrack found an explicit Serial column and will use it.';
  if(!confirm(`Import serial numbers for ALL labs?\n\n${sourceNote}\n\nMatching students will have their current serial number overwritten regardless of which lab they attend.`)){inp.value='';return}let upd=0,miss=0,amb=0;const ops=[],byId=new Map(),byName=new Map();for(const s of S.studs){const ik=norm(s.sid),nk=norm(s.nm);if(ik){const a=byId.get(ik)||[];a.push(s);byId.set(ik,a)}if(nk){const a=byName.get(nk)||[];a.push(s);byName.set(nk,a)}}for(const q of rows){let matches=[];if(q.sid)matches=byId.get(norm(q.sid))||[];else if(q.nm)matches=byName.get(norm(q.nm))||[];if(matches.length===1){ops.push({t:'update',ref:col.doc(matches[0]._),data:{sn:String(q.sn??'').trim()}});upd++}else if(matches.length>1)amb++;else miss++}await commitOps(ops);const used=parsed.source==='row-order'?`Row order used as serial: 1–${rows.length}`:'Explicit Serial column used';alert(`Course serial import complete across all labs.\n${used}\nUpdated: ${upd}\nNot found: ${miss}\nAmbiguous (not changed): ${amb}`)
 }catch(x){alert('Serial import failed: '+x.message)}finally{inp.value=''}};r.readAsArrayBuffer(f)
}

function exAllStudentsExcel(){
 if(!S.cfg||!loadedStudents||!loadedLabs)return alert('Student data is still loading. Please try again after your rosters appear.');if(typeof XLSX==='undefined')return alert('The Excel library could not load. Check your internet connection.');
 const items=S.cfg.items||[],configured=new Set(items.map(i=>i.k));
 const seenWeeks=new Set(rng(S.cfg.weeks)),archivedGrades=new Set();
 for(const student of S.studs){
  for(const key of [...Object.keys(student.att||{}),...Object.keys(student.alt||{})]){const w=Number(key);if(Number.isSafeInteger(w)&&w>0&&w<=999)seenWeeks.add(w)}
  for(const key of Object.keys(student.g||{}))if(!configured.has(key))archivedGrades.add(key)
 }
 const weeks=[...seenWeeks].sort((a,b)=>a-b),extraGrades=[...archivedGrades].sort();

  ...weeks.flatMap(w=>[`Week ${w} attendance`,`Week ${w} visiting lab`,`Week ${w} date`]),
  'Present (incl. visits)','Absent','Visiting sessions',
  ...items.map(i=>i.n+(i.max?' / '+i.max:'')),...extraGrades.map(k=>'Archived grade · '+k)];
 const rows=[cols];
 allBySerial().forEach(s=>{
  const l=S.labs.find(l=>l.id===s.lab),marks=s.att||{},alt=s.alt||{},calcGrades=calc(s),raw=s.g||{};
  const values=weeks.flatMap(w=>[marks[w]==='P'?'Present':marks[w]==='A'?'Absent':marks[w]==='X'?'Present (visiting)':'',marks[w]==='X'?labName(alt[w]):'',(l?.dates||{})[w]||'']);

  rows.push([l?.name||'',String(s.sn??''),String(s.sid??''),s.nm||'',s.st||'',s.note||'',...values,attN(s),absN(s),altN(s),...grades,...extraGrades.map(k=>raw[k]??'')]);
 });

}

  alert('This student was moved or attended another lab. No attendance was changed.');return renderFocus();

async function exTpl(){const c=S.cfg,m=c.map||{},it=k=>c.items.find(i=>i.k==k),cr={...CRS0,...c.course};
 if(!TC.every(([k])=>it(m[k])))return alert('Open Settings, Excel template, and choose an item for each column first.');
 const ss=LS(S.gl);if(ss.length>709)return alert('The template holds 709 students at most.');
 const t=await db.doc('cfg/template').get();if(!t.exists)return alert('Upload the template in Settings first.');
 try{
  const zip=await JSZip.loadAsync(t.data().b64,{base64:true}),P='xl/worksheets/sheet',rd=f=>{const z=zip.file(f);if(!z)throw new Error('Template is missing '+f);return z.async('string')};
  let xml=await rd(P+'1.xml');
  const formulaCountBefore=(xml.match(/<f\b/g)||[]).length,rowCountBefore=(xml.match(/<row\b/g)||[]).length;

  const xr=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const xe=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const cleanAttrs=a=>(' '+String(a||'').trim()).replace(/\s+t="[^"]*"/g,'').replace(/^\s*/,' ');

  // Microsoft Excel is much stricter than Google Sheets about the Shared String Table.
  // Earlier LabTrack builds changed many template cells from shared strings to inlineStr
  // while leaving the template's sharedStrings metadata unchanged. Google Sheets repairs
  // that silently, but Excel can reject the package. V10 keeps Excel-style shared strings.
  const sstPath='xl/sharedStrings.xml',sstFile=zip.file(sstPath);
  if(!sstFile)throw new Error('Template is missing xl/sharedStrings.xml');
  let sstXml=await sstFile.async('string');
  const sstDoc=new DOMParser().parseFromString(sstXml,'application/xml');
  if(sstDoc.getElementsByTagName('parsererror').length)throw new Error('Template sharedStrings.xml is invalid.');
  const sis=[...sstDoc.getElementsByTagName('si')],sharedMap=new Map();
  sis.forEach((si,i)=>{const txt=[...si.getElementsByTagName('t')].map(x=>x.textContent||'').join('');if(!sharedMap.has(txt))sharedMap.set(txt,i)});
  const addedStrings=[];
  const sharedIndex=v=>{v=String(v??'');if(sharedMap.has(v))return sharedMap.get(v);const i=sis.length+addedStrings.length;sharedMap.set(v,i);addedStrings.push(v);return i};

  const make=(ref,attrs,v,kind='auto')=>{attrs=cleanAttrs(attrs||('r="'+ref+'"'));if(!/\br="[^"]+"/.test(attrs))attrs+=' r="'+ref+'"';
   if(v===''||v==null)return '<c'+attrs+'></c>';
   if(kind==='text'){const i=sharedIndex(v);return '<c'+attrs+' t="s"><v>'+i+'</v></c>'}
   const n=typeof v==='number'?v:(typeof v==='string'&&/^-?\d+(?:\.\d+)?$/.test(v.trim())?+v:NaN);
   if(kind==='number'||!Number.isNaN(n))return '<c'+attrs+'><v>'+String(kind==='number'?+v:n)+'</v></c>';
   const i=sharedIndex(v);return '<c'+attrs+' t="s"><v>'+i+'</v></c>'};
  const patchCell=(row,ref,v,kind='auto')=>{
   const re=new RegExp('<c\\b([^>]*\\br="'+xr(ref)+'"[^>]*)\\s*\\/>|<c\\b([^>]*\\br="'+xr(ref)+'"[^>]*)>([\\s\\S]*?)<\\/c>');
   const hit=row.match(re);if(!hit)throw new Error('Template cell '+ref+' is missing.');
   return row.replace(re,make(ref,hit[1]||hit[2],v,kind));
  };

  const mx=k=>+it(m[k]).max||0,G=mx('mid')+mx('cw')+mx('pr'),mc=ss.map(calc);
  const val=(s,k,x)=>{const g=(s.g||{})[k],i=it(k);return i.t=='in'&&typeof g=='string'&&g!==''?g:x[k]};
  const heads={
   1:[['B1',cr.univ,'text'],['D1',cr.prog,'text'],['O1',cr.sem,'text']],
   2:[['E2',cr.code,'text'],['H2',cr.name,'text'],['M2',cr.ch,'auto'],['O2',cr.inst,'text']],
   4:[['D4',mx('mid'),'number'],['E4',mx('cw'),'number'],['F4',mx('pr'),'number'],['G4',G,'number'],['H4',mx('fin'),'number'],['I4',G+mx('fin'),'number']]
  };
  const unyellow={65:47,66:61,67:89,68:48,69:24,70:25,71:26,72:51,73:31,74:34,75:46,76:33,77:28,78:29,79:32,80:0,81:0};
  const clearManualYellow=row=>row.replace(/(<c\b[^>]*\bs=")(\d+)("[^>]*>)/g,(a,p,n,q)=>unyellow[n]!==undefined?p+unyellow[n]+q:a);

  xml=xml.replace(/<row\b[^>]*\br="(\d+)"[^>]*>[\s\S]*?<\/row>/g,(row,rn)=>{
   const n=+rn;if(heads[n]){for(const [ref,v,k] of heads[n])row=patchCell(row,ref,v,k);return row}
   if(n<5||n>713)return row;row=clearManualYellow(row);
   const i=n-5,s=ss[i],x=mc[i];
   if(s){
    const ch=[['A'+n,s.sn===''||isNaN(+s.sn)?i+1:+s.sn,'auto'],['B'+n,s.sid??'','text'],['C'+n,s.nm??'','text'],
     ['D'+n,val(s,m.mid,x),'auto'],['E'+n,val(s,m.cw,x),'auto'],['F'+n,val(s,m.pr,x),'auto'],['H'+n,val(s,m.fin,x),'auto'],
     ['M'+n,s.st&&s.st!=SL[0]?s.st:'','text']];
    for(const [ref,v,k] of ch)row=patchCell(row,ref,v,k);
   }else for(const col of ['A','B','C','D','E','F','H','M'])row=patchCell(row,col+n,'');
   return row;
  });

  const lastDataRow=Math.max(5,4+ss.length);
  const dynamicCountifRanges=(sheetXml,allowLocal)=>sheetXml.replace(/<f\b([^>]*)>([\s\S]*?)<\/f>/g,(whole,attrs,formula)=>{
   if(!/\bCOUNTIFS?\s*\(/i.test(formula))return whole;
   const changed=formula.replace(/((?:'Program_Course Code'!)?)(\$?)([A-Z]{1,3})(\$?)\d+:(\$?)([A-Z]{1,3})(\$?)\d+/g,(ref,prefix,a1,c1,r1,a2,c2,r2)=>{
    if(c1!==c2)return ref;if(!prefix&&!allowLocal)return ref;
    return prefix+a1+c1+r1+'5:'+a2+c2+r2+lastDataRow;
   });
   return '<f'+attrs+'>'+changed+'</f>';
  });
  xml=dynamicCountifRanges(xml,true);

  const formulaCountAfter=(xml.match(/<f\b/g)||[]).length,rowCountAfter=(xml.match(/<row\b/g)||[]).length;
  if(formulaCountAfter!==formulaCountBefore)throw new Error('Formula integrity check failed. No Excel file was created.');
  if(rowCountAfter!==rowCountBefore)throw new Error('Worksheet row integrity check failed. No Excel file was created.');
  const chk=new DOMParser().parseFromString(xml,'application/xml');
  if(chk.getElementsByTagName('parsererror').length)throw new Error('Generated worksheet XML is invalid. No Excel file was created.');
  zip.file(P+'1.xml',xml);

  // Update only the COUNTIF/COUNTIFS ranges in the statistic sheets. V10 deliberately
  // keeps Excel's cached formula results and calcChain intact; the formula cells are
  // the same cells as in the template and Excel can recalculate them on open.
  for(let k=2;k<=5;k++){
   const path=P+k+'.xml',sx=dynamicCountifRanges(await rd(path),false);
   const parsed=new DOMParser().parseFromString(sx,'application/xml');
   if(parsed.getElementsByTagName('parsererror').length)throw new Error('Statistics sheet '+k+' became invalid. No Excel file was created.');
   zip.file(path,sx);
  }

  // Append any new strings to the template's Shared String Table. count/uniqueCount are
  // optional OOXML attributes, so remove them instead of leaving stale values after the
  // roster was shortened/changed. This is the key Excel-compatibility repair in V10.
  if(addedStrings.length){
   const extra=addedStrings.map(v=>'<si><t xml:space="preserve">'+xe(v)+'</t></si>').join('');
   sstXml=sstXml.replace(/<\/sst>\s*$/,extra+'</sst>');
  }
  sstXml=sstXml.replace(/(<sst\b[^>]*?)\s+count="[^"]*"/,'$1').replace(/(<sst\b[^>]*?)\s+uniqueCount="[^"]*"/,'$1');
  const sstCheck=new DOMParser().parseFromString(sstXml,'application/xml');
  if(sstCheck.getElementsByTagName('parsererror').length)throw new Error('Generated sharedStrings.xml is invalid. No Excel file was created.');
  zip.file(sstPath,sstXml);
